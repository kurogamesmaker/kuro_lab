<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f8fc"><meta name="robots" content="noindex,nofollow"><title>ゲームプレイ | KURO GAMES</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#17243c;font-family:Inter,"Noto Sans JP",system-ui,sans-serif}.top{height:64px;display:flex;align-items:center;gap:14px;padding:0 max(18px,calc((100% - 1180px)/2));background:#fff;border-bottom:1px solid #e6ebf3}.brand{font-weight:1000;font-size:19px;color:#2878ee;text-decoration:none}.back{margin-left:auto;text-decoration:none;font-size:12px;font-weight:850;color:#53647d}.wrap{width:min(1180px,calc(100% - 28px));margin:22px auto}.info{display:flex;align-items:center;gap:14px;margin-bottom:14px}.icon{width:52px;height:52px;display:grid;place-items:center;border-radius:14px;background:#e5edff;font-size:28px}.copy{min-width:0}.copy h1{font-size:clamp(19px,3vw,27px);margin:0 0 4px}.copy p{margin:0;color:#718098;font-size:12px;line-height:1.6}.frame-wrap{overflow:hidden;border:1px solid #dce3ee;border-radius:14px;background:#fff;box-shadow:0 12px 35px #263d5b12}.game-frame{display:block;width:100%;height:auto;aspect-ratio:16/9;max-height:78vh;border:0;background:#fff}frame-wrap:fullscreen{width:100vw;height:100vh;border:0;border-radius:0;background:#101522;display:grid;place-items:center}.frame-wrap:fullscreen .game-frame{max-width:100vw;max-height:100vh}.state{padding:70px 20px;text-align:center;color:#718098}.state strong{display:block;color:#17243c;font-size:18px;margin-bottom:8px}.hint{font-size:11px;color:#8390a5;margin:12px 4px}@media(max-width:600px){.top{height:56px;padding:0 14px}.wrap{margin:14px auto}.icon{width:44px;height:44px}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><header class="top"><a class="brand" href="/games/">KURO GAMES</a><a class="back" href="/games/">← ゲーム一覧へ</a></header>
<main class="wrap"><div class="info" id="gameInfo" hidden><div class="icon" id="gameIcon">🎮</div><div class="copy"><h1 id="gameTitle">読み込み中…</h1><p id="gameDescription"></p></div></div><div class="frame-wrap" id="frameWrap"><div class="state" id="state"><strong>ゲームを読み込んでいます</strong>少しお待ちください。</div></div><p class="hint">このゲームは独立したサンドボックス内で実行されます。</p></main>
<script>

const KURO_GAS_TRANSPORT=new URLSearchParams(location.search).get("transport")==="gas";
const KURO_GAS_PROXY_URL="https://kurolab.cc.cd/api/kuro-gas-proxy";
async function kuroGasFetch(input,init){
 const req=new Request(input,init),url=new URL(req.url);
 if(url.origin!=="https://cprvpphlfpmiegjiutjn.supabase.co")return fetch(req);
 const bytes=new Uint8Array(await req.arrayBuffer());let binary="";
 for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode.apply(null,bytes.subarray(i,Math.min(i+0x8000,bytes.length)));
 const headers={};req.headers.forEach((v,k)=>{headers[k]=v;});
 const proxy=await fetch(KURO_GAS_PROXY_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path:url.pathname+url.search,method:req.method,headers,bodyBase64:bytes.length?btoa(binary):"",clientId:"game-studio"})});
 let result;try{result=await proxy.json();}catch(e){throw new Error("GAS中継サーバーの応答を読み取れませんでした");}
 if(!proxy.ok||!result||typeof result.status!=="number")throw new Error(result&&result.error||"GAS中継通信に失敗しました");
 let body=null;if(result.isBinary&&result.bodyBase64){const raw=atob(result.bodyBase64),out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);body=out;}else if(result.bodyText!==undefined&&![204,205,304].includes(result.status))body=result.bodyText;
 return new Response(body,{status:result.status,headers:result.headers||{"Content-Type":"application/json"}});
}
function kuroApplyTransportLinks(){
 if(!KURO_GAS_TRANSPORT)return;
 document.querySelectorAll('a[href^="/game-studio/"],a[href^="/games/"]').forEach(a=>{const u=new URL(a.href,location.origin);u.searchParams.set("transport","gas");a.href=u.pathname+u.search+u.hash;});
}

let kuroGameFrame = null;
const kuroGameAuthClient = window.supabase.createClient(
 "https://cprvpphlfpmiegjiutjn.supabase.co",
 "sb_publishable_BYPUfB0lrh26jV8_6ZQnpQ_wfAKOVyn",
 {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
  global: { fetch: KURO_GAS_TRANSPORT ? kuroGasFetch : window.fetch },
  realtime: { params: { log_level: "info" } }
 }
);
let kuroGameAuthPromise = null;
const kuroGameRealtimeChannels = new Map();
async function getKuroGameAuthSession() {
 if (!kuroGameAuthPromise) {
  kuroGameAuthPromise = (async () => {
   let { data, error } = await kuroGameAuthClient.auth.getSession();
   if (error) throw error;
   if (!data.session) {
    const signed = await kuroGameAuthClient.auth.signInAnonymously();
    if (signed.error) throw signed.error;
    data = { session: signed.data.session };
   }
   if (!data.session || !data.session.access_token) throw new Error("Supabaseのログイン情報を取得できませんでした");
   return data.session;
  })().catch(error => {
   kuroGameAuthPromise = null;
   throw error;
  });
 }
 const session = await kuroGameAuthPromise;
 // Realtime側にも現在のJWTを明示的に設定し、HTTP認証とWebSocket認証のずれを防ぐ
 kuroGameAuthClient.realtime.setAuth(session.access_token);
 return session;
}
window.addEventListener("message", async event => {
 if (!kuroGameFrame || event.source !== kuroGameFrame.contentWindow || !event.data) return;
 const msg = event.data;
 if (msg.type === "kuro-werewolf-realtime-subscribe") {
  const requestId = msg.requestId;
  const roomCode = msg.roomCode;
  if (typeof requestId !== "string" || !/^[A-Za-z0-9_-]{1,80}$/.test(requestId) ||
      typeof roomCode !== "string" || !/^\d{4}$/.test(roomCode)) return;
  // GAS transport cannot carry WebSocket upgrades. Use the verified GAS polling path instead.
  if (KURO_GAS_TRANSPORT) {
   try {
    event.source.postMessage({
     type: "kuro-werewolf-realtime-status",
     requestId,
     status: "POLLING_ONLY",
     detail: "GAS mode: using HTTP polling"
    }, "*");
   } catch (_) {}
   return;
  }
  const previous = kuroGameRealtimeChannels.get(requestId);
  if (previous && previous.source === event.source) {
   kuroGameRealtimeChannels.delete(requestId);
   if (previous.channel) void kuroGameAuthClient.removeChannel(previous.channel);
  }
  try {
   await getKuroGameAuthSession();
   const entry = { source: event.source, channel: null };
   kuroGameRealtimeChannels.set(requestId, entry);
   entry.channel = kuroGameAuthClient
    .channel("kuro-werewolf-" + roomCode + "-" + requestId)
    .on("postgres_changes", {
     event: "*", schema: "public", table: "werewolf_rooms", filter: "room_code=eq." + roomCode
    }, payload => {
     if (kuroGameRealtimeChannels.get(requestId) !== entry) return;
     try {
      entry.source.postMessage({
       type: "kuro-werewolf-realtime-event",
       requestId,
       eventType: payload.eventType
      }, "*");
     } catch (_) {}
    })
    .subscribe((status, error) => {
     if (kuroGameRealtimeChannels.get(requestId) !== entry) return;
     const detail = error
      ? [error.message, error.code, error.details, error.hint].filter(Boolean).join(" | ").slice(0, 240)
      : "";
     if (status === "SUBSCRIBED") {
      console.info("[KURO GAMES Realtime] connected", { roomCode });
     } else {
      console.error("[KURO GAMES Realtime]", status, detail || "(詳細なし)", { roomCode });
     }
     try {
      entry.source.postMessage({
       type: "kuro-werewolf-realtime-status",
       requestId,
       status,
       detail
      }, "*");
     } catch (_) {}
     // CHANNEL_ERROR / TIMED_OUT後も購読を保持し、Supabaseクライアントの自動再接続を受け取れるようにする
    });
  } catch (error) {
   try {
    event.source.postMessage({
     type: "kuro-werewolf-realtime-status",
     requestId,
     status: "CHANNEL_ERROR",
     detail: String(error && error.message || error).slice(0, 240)
    }, "*");
   } catch (_) {}
  }
  return;
 }
 if (msg.type === "kuro-werewolf-realtime-unsubscribe") {
  const requestId = msg.requestId;
  if (typeof requestId === "string") {
   const entry = kuroGameRealtimeChannels.get(requestId);
   if (entry && entry.source === event.source) {
    kuroGameRealtimeChannels.delete(requestId);
    if (entry.channel) void kuroGameAuthClient.removeChannel(entry.channel);
   }
  }
  return;
 }
 if (msg.type === "kuro-werewolf-proxy-request") {
  if (!KURO_GAS_TRANSPORT || typeof msg.requestId !== "string" || typeof msg.path !== "string" ||
      (!msg.path.startsWith("/rest/v1/") && !msg.path.startsWith("/auth/v1/") && !msg.path.startsWith("/storage/v1/"))) return;
  try {
   const bytes = msg.bodyBase64 ? Uint8Array.from(atob(msg.bodyBase64), ch => ch.charCodeAt(0)) : new Uint8Array();
   const request = new Request("https://cprvpphlfpmiegjiutjn.supabase.co" + msg.path, {
    method: msg.method || "GET", headers: msg.headers || {},
    body: ["GET","HEAD"].includes(String(msg.method || "GET").toUpperCase()) ? undefined : bytes
   });
   const response = await kuroGasFetch(request);
   const responseBytes = new Uint8Array(await response.arrayBuffer());
   let binary = "";
   for (let i = 0; i < responseBytes.length; i += 0x8000) binary += String.fromCharCode.apply(null, responseBytes.subarray(i, Math.min(i + 0x8000, responseBytes.length)));
   const responseHeaders = {};
   response.headers.forEach((value, key) => { responseHeaders[key] = value; });
   event.source.postMessage({ type: "kuro-werewolf-proxy-response", requestId: msg.requestId,
    response: { status: response.status, headers: responseHeaders, bodyBase64: responseBytes.length ? btoa(binary) : "" } }, "*");
  } catch (error) {
   event.source.postMessage({ type: "kuro-werewolf-proxy-response", requestId: msg.requestId, error: error?.message || "GAS中継エラー" }, "*");
  }
  return;
 }
 if (msg.type === "kuro-werewolf-storage-set" && typeof msg.key === "string" && msg.key.startsWith("werewolf_")) {
  localStorage.setItem("kuro-werewolf-session:" + msg.key, String(msg.value ?? ""));
  return;
 }
 if (msg.type === "kuro-werewolf-storage-remove" && typeof msg.key === "string" && msg.key.startsWith("werewolf_")) {
  localStorage.removeItem("kuro-werewolf-session:" + msg.key);
  return;
 }
 if (msg.type !== "kuro-werewolf-auth-request") return;
 try {
  const session = await getKuroGameAuthSession();
  const storage = {};
  const prefix = "kuro-werewolf-session:";
  for (let i = 0; i < localStorage.length; i++) {
   const key = localStorage.key(i);
   if (key && key.startsWith(prefix)) storage[key.slice(prefix.length)] = localStorage.getItem(key);
  }
  event.source.postMessage({
   type: "kuro-werewolf-auth",
   useGasProxy: KURO_GAS_TRANSPORT,
   access_token: session.access_token,
   refresh_token: session.refresh_token,
   storage
  }, "*");
 } catch (error) {
  event.source.postMessage({
   type: "kuro-werewolf-auth-error",
   message: error?.message || "Supabase認証に失敗しました"
  }, "*");
 }
});

(async function(){
 const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),id=params.get("id");
 kuroApplyTransportLinks();
 function fail(message){$("state").innerHTML="<strong>ゲームを開けませんでした</strong>"+message;}
 if(!id||!/^[0-9a-f-]{36}$/i.test(id)){fail("ゲームIDが正しくありません。");return;}
 if(!window.supabase||!window.supabase.createClient){fail("通信ライブラリを読み込めませんでした。");return;}
 try{const db=kuroGameAuthClient;
  const {data,error}=await db.from("game_studio_games").select("title,description,icon,html_content").eq("id",id).eq("status","published").maybeSingle();if(error)throw error;if(!data){fail("公開が終了したか、URLが正しくありません。");return;}
  $("gameTitle").textContent=data.title;$("gameDescription").textContent=data.description||"KURO GAME STUDIOで作成されたゲーム";$("gameIcon").textContent=data.icon||"🎮";$("gameInfo").hidden=false;
  const frame=document.createElement("iframe");frame.className="game-frame";frame.title=data.title;frame.setAttribute("sandbox","allow-scripts allow-forms allow-modals");frame.referrerPolicy="no-referrer";
  const frameMeta=String(data.html_content||"").match(/<meta\\s+name=["']kuro-game-frame["']\\s+content=["'](\\d{3,4})x(\\d{3,4})["'][^>]*>/i);
  const frameWidth=frameMeta?Math.max(240,Math.min(3840,Number(frameMeta[1]))):960;
  const frameHeight=frameMeta?Math.max(160,Math.min(2160,Number(frameMeta[2]))):540;
  frame.style.width="min(100%, "+frameWidth+"px)";frame.style.maxWidth="100%";frame.style.aspectRatio=frameWidth+" / "+frameHeight;frame.style.height="auto";frame.style.maxHeight="78vh";
  kuroGameFrame=frame;$("frameWrap").replaceChildren(frame);frame.srcdoc=data.html_content;
 }catch(error){fail(error.message||"通信エラーが発生しました。");}
})();
</script></body></html>
