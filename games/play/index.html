      typeof saved.guestId === "string" && Number(saved.expiresAt) > Date.now() + 60000) return saved;

      Number(data.expiresAt) <= Date.now()) {
   console.warn("KURO guest authentication unavailable:", data.error || response.status);

  }

  try { localStorage.setItem(storageKey, JSON.stringify(guest)); } catch (_) {}

  console.warn("KURO guest authentication unavailable:", error);
  return null;
 }
}

  } catch (error) {
