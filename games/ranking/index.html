<style>
:root{--ink:#17243c;--muted:#718098;--line:#e4eaf3;--blue:#347fe2;--bg:#f5f7fb}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans JP",system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button,select{font:inherit}
.site-header{height:68px;position:sticky;top:0;z-index:20;background:#ffffffed;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.header-inner{width:min(1120px,calc(100% - 36px));height:100%;margin:auto;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:1000;letter-spacing:-.6px;white-space:nowrap}
.brand img{width:36px;height:36px;object-fit:contain}
.brand em{font-style:normal;color:var(--blue)}
.header-spacer{flex:1}
.header-link{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 12px;border:1px solid #e1e8f2;border-radius:10px;background:#fff;color:#52637b;font-size:12px;font-weight:850;white-space:nowrap}
.header-link.primary{border-color:#d4e5ff;background:#edf5ff;color:#286fc8}
.header-link:hover{border-color:#b9d2f2;background:#f7fbff}
.page{width:min(1040px,calc(100% - 36px));margin:0 auto;padding:32px 0 58px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.eyebrow{color:#3980d7;font-size:10px;font-weight:1000;letter-spacing:1.8px}
.hero h1{margin:6px 0 0;font-size:clamp(26px,4vw,36px);line-height:1.15;letter-spacing:-1px}
.hero p{margin:9px 0 0;color:var(--muted);font-size:13px;line-height:1.7}
.hero-mark{display:grid;place-items:center;width:58px;height:58px;flex:0 0 58px;border:1px solid #dbe8fa;border-radius:18px;background:linear-gradient(145deg,#fff,#eff6ff);font-size:29px}
.game-selector{padding:16px 16px 14px;border:1px solid #e1e9f4;border-radius:18px;background:#fff;box-shadow:0 8px 24px #244c7a08}
.section-label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 11px;color:#667993;font-size:11px;font-weight:950}
.section-label small{font-size:10px;font-weight:700;color:#91a0b4}
.game-tabs{display:flex;gap:8px;overflow-x:auto;overscroll-behavior-inline:contain;padding:1px 1px 5px;scrollbar-width:thin;scrollbar-color:#cbd9eb transparent}
.game-tab{flex:0 0 auto;min-height:39px;padding:0 15px;border:1px solid #e4eaf2;border-radius:11px;background:#f8fafd;color:#55677f;font-size:12px;font-weight:900;white-space:nowrap;cursor:pointer;transition:background .16s,border-color .16s,color .16s,transform .16s}
.game-tab:hover{border-color:#c6daf5;background:#f2f7ff}
.game-tab[aria-pressed="true"]{border-color:#347fe2;background:linear-gradient(135deg,#347fe2,#5a9cf0);color:#fff;box-shadow:0 5px 13px #347fe229}
.game-tab:focus-visible,.header-link:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid #93c2ff;outline-offset:2px}
.content-card{margin-top:17px;overflow:hidden;border:1px solid #e0e8f3;border-radius:20px;background:#fff;box-shadow:0 12px 30px #244c7a0a}
.rank-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:20px 22px 16px;border-bottom:1px solid #edf1f6;background:linear-gradient(115deg,#fff 0%,#f7faff 74%,#fffaf0 100%)}
.rank-heading h2{margin:0;color:#203957;font-size:21px;letter-spacing:-.4px}
.rank-subtitle{margin:6px 0 0;color:#75859a;font-size:11px;line-height:1.6}
.live-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid #d8e9ff;border-radius:99px;background:#edf6ff;color:#3479ca;font-size:9px;font-weight:1000;letter-spacing:.5px;white-space:nowrap}
.live-pill i{width:6px;height:6px;border-radius:50%;background:#3986ed;box-shadow:0 0 0 3px #3986ed20}
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid #edf1f6;background:#fcfdff}
.filter-label{display:flex;align-items:center;gap:7px;padding:6px 9px;border:1px solid #e3eaf4;border-radius:10px;background:#fff;color:#667993;font-size:10px;font-weight:850}
.filter-label[hidden]{display:none!important}
.filter-label select{max-width:180px;border:0;outline:0;background:transparent;color:#315f94;font-size:11px;font-weight:900;cursor:pointer}
.refresh-button{margin-left:auto;min-height:30px;padding:0 10px;border:1px solid #e0e8f3;border-radius:9px;background:#fff;color:#60748e;font-size:10px;font-weight:850;cursor:pointer}
.refresh-button:hover{border-color:#b9d2f2;background:#f5f9ff}
.rank-list{display:grid;gap:9px;padding:17px 20px 20px}
.rank-row{display:flex;align-items:center;gap:12px;min-width:0;padding:12px 14px;border:1px solid #e9eef5;border-radius:14px;background:linear-gradient(100deg,#fff,#fbfdff)}
.rank-row.top-one{border-color:#f0dfaa;background:linear-gradient(100deg,#fffdf5,#fff)}
.rank-row.top-two{border-color:#e3e7ee;background:linear-gradient(100deg,#fff,#fafbfd)}
.rank-row.top-three{border-color:#efd9c8;background:linear-gradient(100deg,#fffaf7,#fff)}
.rank-medal{display:grid;place-items:center;width:34px;flex:0 0 34px;font-size:22px}
.rank-number{display:none}
.rank-profile{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.rank-avatar{display:grid;place-items:center;width:42px;height:42px;flex:0 0 42px;overflow:hidden;border:1px solid #e3eaf4;border-radius:50%;background:#f0f5fb;color:#60758f;font-size:15px;font-weight:950}
.rank-avatar img{width:100%;height:100%;object-fit:cover}
.rank-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#3b4e68;font-size:13px;font-weight:900}
.rank-profile:hover .rank-name{color:#2675d0;text-decoration:underline;text-underline-offset:3px}
.rank-score{color:#2d73c9;font-size:13px;font-weight:1000;white-space:nowrap}
.rank-message{display:grid;place-items:center;min-height:210px;padding:30px 15px;color:#8190a4;text-align:center;font-size:12px;line-height:1.8}
.rank-message strong{display:block;margin-bottom:5px;color:#526781;font-size:13px}
.game-link-wrap{padding:0 20px 18px;text-align:right}
.game-link{display:inline-flex;align-items:center;gap:6px;color:#3479ca;font-size:11px;font-weight:900}
.game-link:hover{text-decoration:underline;text-underline-offset:3px}
.footer{padding:20px 18px;border-top:1px solid #e2e9f2;background:#fff;color:#8491a3;text-align:center;font-size:10px}
.footer a{color:#4b7db9;font-weight:850}
@media(max-width:640px){
 .site-header{height:60px}
 .header-inner{width:calc(100% - 24px);gap:8px}
 .brand{font-size:17px;gap:7px}.brand img{width:31px;height:31px}
 .header-link{min-height:34px;padding:0 9px;font-size:10px}
 .page{width:calc(100% - 24px);padding:23px 0 42px}
 .hero{margin-bottom:16px}.hero-mark{width:48px;height:48px;flex-basis:48px;border-radius:15px}
 .game-selector{padding:13px 12px 10px}
 .rank-heading{padding:17px 15px 13px}.rank-heading h2{font-size:18px}
 .filters{padding:10px 13px}
 .rank-list{padding:13px}
 .rank-row{gap:8px;padding:10px}
 .rank-medal{width:28px;flex-basis:28px;font-size:19px}
 .rank-avatar{width:37px;height:37px;flex-basis:37px}
 .rank-name{font-size:12px}.rank-score{font-size:12px}
 .game-link-wrap{padding:0 14px 15px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.game-tab{transition:none}}
</style>

<script>
"use strict";
const KURO_CLOUDFLARE_PROXY_URL="https://kurolab.cc.cd/api/cloudflare-relay";
async function kuroCloudflareFetch(input,init){
 const req=new Request(input,init),url=new URL(req.url);
 if(url.origin!=="https://cprvpphlfpmiegjiutjn.supabase.co")return fetch(req);
 const bytes=new Uint8Array(await req.arrayBuffer());let binary="";
 for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode.apply(null,bytes.subarray(i,Math.min(i+0x8000,bytes.length)));
 const headers={};req.headers.forEach((v,k)=>{headers[k]=v;});
 const proxy=await fetch(KURO_CLOUDFLARE_PROXY_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path:url.pathname+url.search,method:req.method,headers,bodyBase64:bytes.length?btoa(binary):"",clientId:"game-studio"})});
 let result;try{result=await proxy.json();}catch(e){throw new Error("Cloudflare中継サーバーの応答を読み取れませんでした");}
 if(!proxy.ok||!result||typeof result.status!=="number")throw new Error(result&&result.error||"Cloudflare中継通信に失敗しました");
 let body=null;if(result.isBinary&&result.bodyBase64){const raw=atob(result.bodyBase64),out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);body=out;}else if(result.bodyText!==undefined&&![204,205,304].includes(result.status))body=result.bodyText;
 return new Response(body,{status:result.status,headers:result.headers||{"Content-Type":"application/json"}});
}
window.kuroGamesDB=null;
if(window.supabase&&typeof window.supabase.createClient==="function"){
 window.kuroGamesDB=window.supabase.createClient("https://cprvpphlfpmiegjiutjn.supabase.co","sb_publishable_BYPUfB0lrh26jV8_6ZQnpQ_wfAKOVyn",{
  global:{fetch:kuroCloudflareFetch},
  auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}
 });
}
(function initKuroRankingPage(){
 const db=window.kuroGamesDB;
 const tabsEl=document.getElementById("gameTabs"),countEl=document.getElementById("gameCount");
 const titleEl=document.getElementById("selectedGameTitle"),modeTextEl=document.getElementById("selectedModeText");
 const listEl=document.getElementById("rankList"),gameLink=document.getElementById("gameLink");
 const modeWrap=document.getElementById("modeWrap"),modeSelect=document.getElementById("modeSelect");
 const cpuWrap=document.getElementById("cpuWrap"),cpuSelect=document.getElementById("cpuSelect");
 const levelWrap=document.getElementById("levelWrap"),levelSelect=document.getElementById("levelSelect");
 const refreshButton=document.getElementById("refreshButton");
 const TICTACTOE_GAME_ID="2dbd6773-2684-4f00-973e-c46acbc348e7";
 const TICTACTOE_RULES=["normal","vanish","gobble","reverse"];
 const medals=["🥇","🥈","🥉","4","5"];
 const cache=new Map();
 let games=[],selectedGameId="",requestToken=0;
 function showMessage(title,detail){
  listEl.replaceChildren();
  const box=document.createElement("div");box.className="rank-message";
  const strong=document.createElement("strong");strong.textContent=title;box.append(strong);
  if(detail){const span=document.createElement("span");span.textContent=detail;box.append(span);}
  listEl.append(box);
 }
 function modeName(mode){
  const names={normal:"通常ルール・勝利数",vanish:"消えるルール・勝利数",gobble:"食べるルール・勝利数",reverse:"逆転ルール・勝利数","wins-bot":"CPU戦・勝利数","wins-online":"オンライン対戦・勝利数",werewolf_villager_wins:"村人陣営の勝利数",werewolf_wolf_wins:"人狼陣営の勝利数",normal_beginner:"ノーマル・初心者"};
  return mode==="default"?"":(names[mode]||String(mode).replace(/[_-]+/g," "));
 }
 function cleanGroupLabel(mode){
  if(/^(cpu|bot)$/i.test(mode))return "CPU戦";
  return (modeName(mode)||mode).replace(/・(勝利数|点)$/,"");
 }
 function difficultyLabel(raw){
  const value=String(raw||"").toLowerCase();
  const names={beginner:"初心者",novice:"初心者",easy:"初級",normal:"標準",medium:"中級",intermediate:"中級",hard:"上級",advanced:"上級",expert:"Expert",master:"マスター"};
  if(names[value])return names[value];
  const match=value.match(/^(?:lv|level)(\d+)$/);
  if(match)return "Lv."+match[1];
  if(/^\d+$/.test(value))return "Lv."+value;
  return String(raw||"").replace(/[_-]+/g," ");
 }
 function splitDifficultyMode(mode){
  const match=String(mode||"").match(/^(.+?)[_-](beginner|novice|easy|normal|medium|intermediate|hard|advanced|expert|master|lv\d+|level\d+|\d+|初心者|初級|中級|上級)$/i);
  return match&&match[1]?{base:match[1],difficulty:difficultyLabel(match[2])}:null;
 }
 function buildModeGroups(modes){
  const list=Array.from(new Set((modes||[]).filter(value=>typeof value==="string"&&value)));
  return list.map((mode,order)=>{
   const part=splitDifficultyMode(mode);
   const label=part?cleanGroupLabel(part.base)+"・"+part.difficulty:cleanGroupLabel(mode);
   return {key:"mode:"+mode,label,modes:[{mode:mode,difficulty:part?part.difficulty:""}],order:order};
  });
 }
 function selectedModeInfo(game){
  const group=(game.modeGroups||[]).find(item=>item.key===game.selectedGroupKey)||(game.modeGroups||[])[0];
  if(!group||!group.modes.length)return {mode:"default",difficulty:""};
  return group.modes.find(item=>item.mode===game.selectedMode)||group.modes[0];
 }
 function renderTabs(){
  tabsEl.replaceChildren();
  games.forEach(game=>{
   const button=document.createElement("button");
   button.type="button";button.className="game-tab";button.textContent=game.title;
   button.setAttribute("aria-pressed",String(game.id===selectedGameId));
   button.addEventListener("click",()=>selectGame(game.id));
   tabsEl.append(button);
  });
  countEl.textContent=games.length+"ゲーム";
 }
 function renderFilters(game){
  const groups=game.modeGroups||[];
  modeWrap.hidden=groups.length<=1;
  modeSelect.replaceChildren();
  groups.forEach(group=>{
   const option=document.createElement("option");option.value=group.key;option.textContent=group.label;modeSelect.append(option);
  });
  modeSelect.value=game.selectedGroupKey;
  const active=selectedModeInfo(game);
  const group=groups.find(item=>item.key===game.selectedGroupKey)||groups[0];
  const isCpu=/cpu|bot/i.test(String(group&&group.key||"")+" "+active.mode);
  const levels=Array.isArray(game.levels)?game.levels:[];
  const cpus=Array.isArray(game.cpuDifficulties)?game.cpuDifficulties:[];
  levelWrap.hidden=!levels.length;
  levelSelect.replaceChildren();
  const allLevels=document.createElement("option");allLevels.value="";allLevels.textContent="すべて";levelSelect.append(allLevels);
  levels.forEach(value=>{const option=document.createElement("option");option.value=String(Number(value));option.textContent="Lv."+Number(value);levelSelect.append(option);});
  cpuWrap.hidden=!isCpu||!cpus.length;
  cpuSelect.replaceChildren();
  const allCpus=document.createElement("option");allCpus.value="";allCpus.textContent="すべて";cpuSelect.append(allCpus);
  const cpuNames={EASY:"よわい",NORMAL:"ふつう",HARD:"つよい",EXPERT:"Expert"};
  cpus.forEach(value=>{const option=document.createElement("option");option.value=value;option.textContent=cpuNames[value]||value;cpuSelect.append(option);});
 }
 async function loadCatalog(){
  const {data:published,error:gamesError}=await db.from("game_studio_games").select("id,title,status").eq("status","published").order("published_at",{ascending:false}).limit(60);
  if(gamesError)throw gamesError;
  const configured=await Promise.all((published||[]).filter(game=>game.id&&game.title).map(async game=>{
   try{
    const {data,error}=await db.functions.invoke("kurogames-online",{body:{action:"get_config",gameId:game.id}});
    if(error)throw error;
    return data&&data.features&&data.features.ranking===true?game:null;
   }catch(error){console.debug("Ranking config skipped:",game.id,error);return null;}
  }));
  const enabled=configured.filter(Boolean);
  const loaded=await Promise.all(enabled.map(async game=>{
   try{
    const {data,error}=await db.functions.invoke("kurogames-online",{body:{action:"leaderboard_modes",gameId:game.id}});
    if(error)throw error;
    const levels=Array.isArray(data&&data.levels)?data.levels:[];
    const cpuDifficulties=Array.isArray(data&&data.cpuDifficulties)?data.cpuDifficulties:[];
    const showcaseConfig=data&&data.showcaseConfig&&typeof data.showcaseConfig==="object"?data.showcaseConfig:{modes:{}};
    const settings=showcaseConfig.modes&&typeof showcaseConfig.modes==="object"?showcaseConfig.modes:{};
    const baseModes=game.id===TICTACTOE_GAME_ID?TICTACTOE_RULES:(Array.isArray(data&&data.modes)&&data.modes.length?data.modes:["default"]);
    const modes=baseModes.filter(mode=>settings[mode]&&settings[mode].enabled===false?false:true).sort((a,b)=>{
     const ai=Number.isFinite(Number(settings[a]&&settings[a].order))?Number(settings[a].order):1000+baseModes.indexOf(a);
     const bi=Number.isFinite(Number(settings[b]&&settings[b].order))?Number(settings[b].order):1000+baseModes.indexOf(b);
     return ai-bi;
    });
    const modeGroups=buildModeGroups(modes);
    if(!modeGroups.length)return null;
    return {id:game.id,title:game.title,modeGroups:modeGroups,selectedGroupKey:modeGroups[0].key,selectedMode:modeGroups[0].modes[0].mode,levels:levels,cpuDifficulties:cpuDifficulties,showcaseConfig:showcaseConfig};
   }catch(error){console.debug("Ranking modes skipped:",game.id,error);return null;}
  }));
  return loaded.filter(Boolean);
 }
 async function fetchRanking(game){
  const active=selectedModeInfo(game);
  const level=levelSelect.value||"",cpu=cpuSelect.value||"";
  const key=game.id+"::"+active.mode+"::"+level+"::"+cpu;
  const cached=cache.get(key);
  if(cached&&Date.now()-cached.at<30000)return cached.rows;
  const body={action:"leaderboard",gameId:game.id,mode:active.mode,limit:5};
  if(level!=="")body.level=Number(level);
  if(cpu!=="")body.cpuDifficulty=cpu;
  const {data,error}=await db.functions.invoke("kurogames-online",{body:body});
  if(error)throw error;
  const rows=(Array.isArray(data&&data.scores)?data.scores:[]).slice(0,5).map((row,index)=>Object.assign({},row,{
   rank:Number(row.rank)||index+1,score:Number(row.score)||0,
   user:row.user||{username:"プレイヤー",display_name:"プレイヤー"}
  }));
  cache.set(key,{rows:rows,at:Date.now()});
  return rows;
 }
 function scoreText(game,row,mode){
  const value=Number(row.score||0).toLocaleString("ja-JP");
  const setting=game.showcaseConfig&&game.showcaseConfig.modes&&game.showcaseConfig.modes[mode];
  if(setting&&typeof setting.scoreSuffix==="string")return value+setting.scoreSuffix;
  if(game.id===TICTACTOE_GAME_ID||/wins|_wins/.test(mode))return value+"勝";
  if(/score|normal_beginner/.test(mode))return value+"点";
  return value;
 }
 function makeProfile(row){
  const userName=String(row.user&& (row.user.username||row.user.display_name)||"プレイヤー");
  const userId=String(row.userId||"");
  const profile=document.createElement(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(userId)?"a":"div");
  profile.className="rank-profile";
  if(profile.tagName==="A"){profile.href="/sns/?profile="+encodeURIComponent(userId);profile.setAttribute("aria-label",userName+"のKURO SNSプロフィールを開く");}
  const avatar=document.createElement("span");avatar.className="rank-avatar";
  const initial=document.createElement("span");initial.textContent=userName.slice(0,1)||"K";avatar.append(initial);
  const rawAvatar=String(row.user&&row.user.avatar_url||"");
  if(rawAvatar){
   try{
    const avatarUrl=new URL(rawAvatar,location.origin);
    if(avatarUrl.protocol==="https:"||avatarUrl.protocol==="http:"){
     const image=document.createElement("img");image.src=avatarUrl.href;image.alt="";image.loading="lazy";image.decoding="async";image.referrerPolicy="no-referrer";
     image.addEventListener("error",()=>image.remove(),{once:true});avatar.append(image);
    }
   }catch(_){}
  }
  const name=document.createElement("span");name.className="rank-name";name.textContent=userName;
  profile.append(avatar,name);
  return profile;
 }
 function renderRows(game,rows){
  listEl.replaceChildren();
  if(!rows.length){showMessage("まだランキングの記録がありません。","このゲームでプレイすると、記録がここに表示されます。");return;}
  rows.forEach((row,index)=>{
   const item=document.createElement("article");
   item.className="rank-row"+(index===0?" top-one":index===1?" top-two":index===2?" top-three":"");
   const medal=document.createElement("span");medal.className="rank-medal";medal.textContent=medals[index]||String(index+1);
   const profile=makeProfile(row);
   const score=document.createElement("span");score.className="rank-score";
   score.textContent=scoreText(game,row,selectedModeInfo(game).mode);
   item.append(medal,profile,score);listEl.append(item);
  });
 }
 async function selectGame(gameId,forceRefresh){
  const game=games.find(item=>item.id===gameId);
  if(!game)return;
  selectedGameId=game.id;
  const token=++requestToken;
  renderTabs();
  renderFilters(game);
  const active=selectedModeInfo(game);
  titleEl.textContent=game.title+" ランキング";
  const group=game.modeGroups.find(item=>item.key===game.selectedGroupKey);
  const modeLabel=(group&&group.label)||active.mode;
  modeTextEl.textContent="ランキング区分："+modeLabel;
  gameLink.href="/games/play/?id="+encodeURIComponent(game.id);
  showMessage("ランキングを読み込み中…","最新のランキングを取得しています。");
  if(forceRefresh)cache.clear();
  try{
   const rows=await fetchRanking(game);
   if(token!==requestToken||selectedGameId!==game.id)return;
   renderRows(game,rows);
  }catch(error){
   if(token!==requestToken||selectedGameId!==game.id)return;
   showMessage("ランキングを取得できませんでした。","通信状態を確認して、更新ボタンから再試行してください。");
   console.warn("KURO ranking page fetch failed:",error);
  }
 }
 modeSelect.addEventListener("change",()=>{
  const game=games.find(item=>item.id===selectedGameId);if(!game)return;
  game.selectedGroupKey=modeSelect.value;
  const active=selectedModeInfo(game);game.selectedMode=active.mode;
  selectGame(game.id,true);
 });
 cpuSelect.addEventListener("change",()=>selectGame(selectedGameId,true));
 levelSelect.addEventListener("change",()=>selectGame(selectedGameId,true));
 refreshButton.addEventListener("click",()=>selectGame(selectedGameId,true));
 async function initialize(){
  if(!db){showMessage("ランキング通信を準備できませんでした。","ページを再読み込みして、もう一度お試しください。");tabsEl.textContent="ランキングを読み込めませんでした。";return;}
  try{
   showMessage("ランキング対応ゲームを確認しています。","トップ画面と同じ公開ゲーム・ランキング設定を読み込んでいます。");
   games=await loadCatalog();
   if(!games.length){
    countEl.textContent="0ゲーム";
    tabsEl.textContent="ランキング対応ゲームはまだありません。";
    showMessage("ランキング対応ゲームはまだありません。","ゲームが公開され、ランキング設定が有効になるとここに表示されます。");
    return;
   }
   renderTabs();
   await selectGame(games[0].id);
   window.setInterval(()=>{
    if(selectedGameId)selectGame(selectedGameId,true);
   },30000);
  }catch(error){
   console.warn("KURO ranking page initialization failed:",error);
   countEl.textContent="読み込みエラー";
   tabsEl.textContent="ランキングを読み込めませんでした。";
   showMessage("ランキングを読み込めませんでした。","しばらくしてからページを再読み込みしてください。");
  }
 }
 initialize();
})();
</script>
