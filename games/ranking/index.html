 function modeName(mode){
  const names={normal:"通常ルール・勝利数",vanish:"消えるルール・勝利数",gobble:"食べるルール・勝利数",reverse:"逆転ルール・勝利数","wins-bot":"CPU戦・勝利数","wins-online":"オンライン対戦・勝利数",werewolf_villager_wins:"村人陣営の勝利数",werewolf_wolf_wins:"人狼陣営の勝利数",normal_beginner:"ノーマル・初心者"};

  if(/^(cpu|bot)$/i.test(mode))return "CPU戦";
  return (modeName(mode)||mode).replace(/・(勝利数|点)$/,"");
 }
 function difficultyLabel(raw){
  const value=String(raw||"").toLowerCase();
  const names={beginner:"初心者",novice:"初心者",easy:"初級",normal:"標準",medium:"中級",intermediate:"中級",hard:"上級",advanced:"上級",expert:"Expert",master:"マスター"};

  const match=value.match(/^(?:lv|level)(\d+)$/);

  if(/^\d+$/.test(value))return "Lv."+value;

 function splitDifficultyMode(mode){
  const match=String(mode||"").match(/^(.+?)[_-](beginner|novice|easy|normal|medium|intermediate|hard|advanced|expert|master|lv\d+|level\d+|\d+|初心者|初級|中級|上級)$/i);

  levelWrap.hidden=!levels.length;
  levelSelect.replaceChildren();
  const allLevels=document.createElement("option");allLevels.value="";allLevels.textContent="すべて";levelSelect.append(allLevels);
  levels.forEach(value=>{const option=document.createElement("option");option.value=String(Number(value));option.textContent="Lv."+Number(value);levelSelect.append(option);});
  levelSelect.value=levels.some(value=>String(Number(value))===previousLevel)?previousLevel:"";
  cpuWrap.hidden=!hasCpuMode||!cpus.length;
  cpuSelect.replaceChildren();
  const allCpus=document.createElement("option");allCpus.value="";allCpus.textContent="すべて";cpuSelect.append(allCpus);
  const cpuNames={EASY:"よわい",NORMAL:"ふつう",HARD:"つよい",EXPERT:"Expert"};
  cpus.forEach(value=>{const option=document.createElement("option");option.value=value;option.textContent=cpuNames[value]||value;cpuSelect.append(option);});
  cpuSelect.value=cpus.includes(previousCpu)?previousCpu:"";
 }
 async function loadCatalog(){
  const {data:published,error:gamesError}=await db.from("game_studio_games").select("id,title,status").eq("status","published").order("published_at",{ascending:false}).limit(60);
  if(gamesError)throw gamesError;
  const configured=await Promise.all((published||[]).filter(game=>game.id&&game.title).map(async game=>{
   try{
    const {data,error}=await db.functions.invoke("kurogames-online",{body:{action:"get_config",gameId:game.id}});
    if(error)throw error;
    return data&&data.features&&data.features.ranking===true?game:null;
   }catch(error){console.debug("Ranking config skipped:",game.id,error);return null;}
  }));
  const enabled=configured.filter(Boolean);
  const loaded=await Promise.all(enabled.map(async game=>{
   try{
    const {data,error}=await db.functions.invoke("kurogames-online",{body:{action:"leaderboard_modes",gameId:game.id}});
    if(error)throw error;
    const levels=Array.isArray(data&&data.levels)?data.levels:[];
    const cpuDifficulties=Array.isArray(data&&data.cpuDifficulties)?data.cpuDifficulties:[];
    const showcaseConfig=data&&data.showcaseConfig&&typeof data.showcaseConfig==="object"?data.showcaseConfig:{modes:{}};
    const settings=showcaseConfig.modes&&typeof showcaseConfig.modes==="object"?showcaseConfig.modes:{};
    const baseModes=game.id===TICTACTOE_GAME_ID?TICTACTOE_RULES:(Array.isArray(data&&data.modes)&&data.modes.length?data.modes:["default"]);
    const modes=baseModes.filter(mode=>settings[mode]&&settings[mode].enabled===false?false:true).sort((a,b)=>{
     const ai=Number.isFinite(Number(settings[a]&&settings[a].order))?Number(settings[a].order):1000+baseModes.indexOf(a);
     const bi=Number.isFinite(Number(settings[b]&&settings[b].order))?Number(settings[b].order):1000+baseModes.indexOf(b);
     return ai-bi;
    });
    const modeGroups=buildModeGroups(modes);
    if(!modeGroups.length)return null;
    return {id:game.id,title:game.title,modeGroups:modeGroups,selectedGroupKey:modeGroups[0].key,selectedMode:modeGroups[0].modes[0].mode,levels:levels,cpuDifficulties:cpuDifficulties,showcaseConfig:showcaseConfig};
   }catch(error){console.debug("Ranking modes skipped:",game.id,error);return null;}
  }));
  return loaded.filter(Boolean);
 }
 async function fetchRanking(game,modeInfo){
  const mode=modeInfo.mode;
  const level=levelSelect.value||"",cpu=cpuSelect.value||"";
  const useCpuFilter=isCpuMode(mode);
  const key=game.id+"::"+mode+"::"+level+"::"+(useCpuFilter?cpu:"");
  const cached=cache.get(key);
  if(cached&&Date.now()-cached.at<30000)return cached.rows;
  const body={action:"leaderboard",gameId:game.id,mode:mode,limit:5};
  if(level!=="")body.level=Number(level);
  if(useCpuFilter&&cpu!=="")body.cpuDifficulty=cpu;
  const {data,error}=await db.functions.invoke("kurogames-online",{body:body});
  if(error)throw error;
  const rows=(Array.isArray(data&&data.scores)?data.scores:[]).slice(0,5).map((row,index)=>Object.assign({},row,{
   rank:Number(row.rank)||index+1,score:Number(row.score)||0,
   user:row.user||{username:"プレイヤー",display_name:"プレイヤー"}
  }));
  cache.set(key,{rows:rows,at:Date.now()});
  return rows;
 }
 function scoreText(game,row,mode){
  const value=Number(row.score||0).toLocaleString("ja-JP");
  const setting=game.showcaseConfig&&game.showcaseConfig.modes&&game.showcaseConfig.modes[mode];
  if(setting&&typeof setting.scoreSuffix==="string")return value+setting.scoreSuffix;
  if(game.id===TICTACTOE_GAME_ID||/wins|_wins/.test(mode))return value+"勝";
  if(/score|normal_beginner/.test(mode))return value+"点";
  return value;
 }
 function makeProfile(row){
  const userName=String(row.user&& (row.user.username||row.user.display_name)||"プレイヤー");
  const userId=String(row.userId||"");
  const hasUserId=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(userId);
  const profile=document.createElement(hasUserId?"button":"div");
  if(hasUserId){profile.type="button";profile.setAttribute("data-kuro-profile-user",userId);profile.setAttribute("aria-label",userName+"の共通プロフィールを開く");}
  profile.className="rank-profile";
  
  const avatar=document.createElement("span");avatar.className="rank-avatar";
  const initial=document.createElement("span");initial.textContent=userName.slice(0,1)||"K";avatar.append(initial);
  const rawAvatar=String(row.user&&row.user.avatar_url||"");
  if(rawAvatar){
   try{
    const avatarUrl=new URL(rawAvatar,location.origin);
    if(avatarUrl.protocol==="https:"||avatarUrl.protocol==="http:"){
     const image=document.createElement("img");image.src=avatarUrl.href;image.alt="";image.loading="lazy";image.decoding="async";image.referrerPolicy="no-referrer";
     image.addEventListener("error",()=>image.remove(),{once:true});avatar.append(image);
    }
   }catch(_){}
  }
  const name=document.createElement("span");name.className="rank-name";name.textContent=userName;
  profile.append(avatar,name);
  return profile;
 }
 function createRankRow(game,row,index,mode){
  const item=document.createElement("article");
  item.className="rank-row"+(index===0?" top-one":index===1?" top-two":index===2?" top-three":"");
  const medal=document.createElement("span");medal.className="rank-medal";medal.textContent=medals[index]||String(row.rank||index+1);
  const profile=makeProfile(row);
  const score=document.createElement("span");score.className="rank-score";score.textContent=scoreText(game,row,mode);
  item.append(medal,profile,score);
  return item;
 }
 function renderModeColumns(game,results){
  listEl.replaceChildren();
  listEl.classList.add("mode-board");
  const maxRows=Math.max(5,...results.map(result=>result.rows.length));
  const scroll=document.createElement("div");
  scroll.className="rank-table-scroll";
  const table=document.createElement("table");
  table.className="rank-table";
  const thead=document.createElement("thead");
  const headerRow=document.createElement("tr");
  results.forEach(result=>{
   const th=document.createElement("th");
   th.scope="col";
   th.textContent=result.group.label;
   headerRow.append(th);
  });
  thead.append(headerRow);
  const tbody=document.createElement("tbody");
  const states=results.map(result=>result.error?"取得できませんでした":result.rows.length===0?"まだ記録がありません。":"");
  for(let index=0;index<maxRows;index++){
   const tr=document.createElement("tr");
   results.forEach((result,columnIndex)=>{
    if(states[columnIndex]){
     if(index===0){
      const td=document.createElement("td");
      td.className="table-state";
      td.rowSpan=maxRows;
      td.textContent=states[columnIndex];
      tr.append(td);
     }
     return;
    }
    const td=document.createElement("td");
    const row=result.rows[index];
    if(row){
     const cell=document.createElement("div");
     cell.className="rank-cell";
     const medal=document.createElement("span");
     medal.className="rank-medal";
     medal.textContent=medals[index]||String(row.rank||index+1);
     cell.append(medal,makeProfile(row));
     const score=document.createElement("span");
     score.className="rank-score";
     score.textContent=scoreText(game,row,result.group.modes[0].mode);
     cell.append(score);
     td.append(cell);
    }else{
     td.className="table-blank";
     td.textContent="—";
    }
    tr.append(td);
   });
   tbody.append(tr);
  }
  table.append(thead,tbody);
  scroll.append(table);
  listEl.append(scroll);
 }
 async function selectGame(gameId,forceRefresh){
  const game=games.find(item=>item.id===gameId);
  if(!game)return;
  selectedGameId=game.id;
  const token=++requestToken;
  renderTabs();
  renderFilters(game);
  const groups=game.modeGroups||[];
  titleEl.textContent=game.title+" ランキング";
  modeTextEl.textContent=groups.length>1
   ? groups.length+"種類のランキングを1つの表にまとめ、モードを列、順位を行として表示します。"
   : "ランキング上位5人";
  gameLink.href="/games/play/?id="+encodeURIComponent(game.id);
  showMessage("ランキングを読み込み中…","各モードのランキングを取得しています。");
  if(forceRefresh)cache.clear();
  const results=await Promise.all(groups.map(async group=>{
   const modeInfo=group.modes[0]||{mode:"default",difficulty:""};
   try{return {group:group,rows:await fetchRanking(game,modeInfo),error:null};}
   catch(error){console.warn("KURO ranking mode fetch failed:",game.id,modeInfo.mode,error);return {group:group,rows:[],error:error};}
  }));
  if(token!==requestToken||selectedGameId!==game.id)return;
  renderModeColumns(game,results);
 }
 cpuSelect.addEventListener("change",()=>selectGame(selectedGameId,true));
 levelSelect.addEventListener("change",()=>selectGame(selectedGameId,true));
 refreshButton.addEventListener("click",()=>selectGame(selectedGameId,true));
 async function initialize(){
  if(!db){showMessage("ランキング通信を準備できませんでした。","ページを再読み込みして、もう一度お試しください。");tabsEl.textContent="ランキングを読み込めませんでした。";return;}
  try{
   showMessage("ランキング対応ゲームを確認しています。","トップ画面と同じ公開ゲーム・ランキング設定を読み込んでいます。");
   games=await loadCatalog();
   if(!games.length){
    countEl.textContent="0ゲーム";
    tabsEl.textContent="ランキング対応ゲームはまだありません。";
    showMessage("ランキング対応ゲームはまだありません。","ゲームが公開され、ランキング設定が有効になるとここに表示されます。");
    return;
   }
   renderTabs();
   await selectGame(games[0].id);
   window.setInterval(()=>{
    if(selectedGameId)selectGame(selectedGameId,true);
   },30000);
  }catch(error){
   console.warn("KURO ranking page initialization failed:",error);
   countEl.textContent="読み込みエラー";
   tabsEl.textContent="ランキングを読み込めませんでした。";
   showMessage("ランキングを読み込めませんでした。","しばらくしてからページを再読み込みしてください。");
  }
 }
 initialize();
})();
