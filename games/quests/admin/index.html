<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>クエスト管理｜KURO Admin</title><style>body{margin:0;background:#0b1220;color:#edf4ff;font:14px system-ui}.wrap{max-width:900px;margin:auto;padding:24px 14px}.card{background:#111c2d;border:1px solid #26364d;border-radius:15px;padding:18px;margin:14px 0}input,textarea,select{display:block;width:100%;margin:5px 0 12px;padding:10px;background:#0b1524;color:#edf4ff;border:1px solid #30445e;border-radius:9px}textarea{min-height:80px}button{padding:9px 13px;border-radius:9px;border:1px solid #2c4765;background:#183451;color:#e9f5ff;cursor:pointer;margin:3px}button.primary{background:#4da5e4;color:#071523;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border:1px solid #283b55;border-radius:12px;padding:12px;margin:8px 0}.item h3{margin:0 0 5px}.item small{color:#9aacc3}.row{display:flex;gap:8px;flex-wrap:wrap}.status{color:#a9bdd2;font-size:12px}.item button{font-size:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>KURO QUEST 管理</h1><p>クエスト内容・XP・有効状態を管理します。達成条件と必要回数を設定できます。</p><section class="card"><h2 id="formTitle">クエスト作成</h2><form id="form"><div class="grid"><label>クエストID<input id="key" required pattern="[a-z0-9_]{2,49}" placeholder="quest_key"></label><label>XP報酬<input id="xp" type="number" min="1" max="100000" value="100" required></label></div><label>タイトル<input id="title" maxlength="100" required></label><label>説明<textarea id="description" maxlength="500" required></textarea></label><label>達成条件<select id="event"><option value="profile_created">アカウント登録時</option><option value="first_post">KURO SNS 初投稿</option><option value="post_count">KURO SNS 投稿回数</option><option value="game_play_count">ゲームプレイ回数（全ゲーム）</option><option value="game_win_count">ゲーム勝利回数（全ゲーム）</option></select></label><label id="conditionWrap">必要回数（カウント条件のみ）<input id="conditionValue" type="number" min="1" max="1000000" value="1" required><small>投稿回数・ゲームプレイ・ゲーム勝利のクエストで使用します。</small></label><label><input id="enabled" type="checkbox" checked style="display:inline;width:auto"> 有効にする</label><div class="row"><button class="primary" type="submit">保存</button><button type="button" id="reset">新規作成に戻る</button></div></form><p id="status" class="status"></p></section><section class="card"><h2>登録済みクエスト</h2><div id="list">読み込み中…</div></section><p><a style="color:#91c9ee" href="/games/quests/">クエストページへ</a>　<a style="color:#91c9ee" href="/games/">KURO GAMES</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{const db=window.supabase.createClient("https://cprvpphlfpmiegjiutjn.supabase.co","sb_publishable_BYPUfB0lrh26jV8_6ZQnpQ_wfAKOVyn",{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}});let editing=null;const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function invoke(body){
 const {data,error}=await db.functions.invoke("admin-console",{body});
 if(error){
  let detail="";
  try{const payload=await error.context?.json?.();detail=payload?.error||payload?.message||""}catch{}
  const status=error.context?.status?(" [HTTP "+error.context.status+"]"):"";
  throw Error((detail||error.message||"通信に失敗しました")+status);
 }
 if(data?.error)throw Error(data.error);
 if(!data||typeof data!=="object")throw Error("サーバーから不正な応答が返されました");
 return data;
}
async function load(){
 const host=$("list");
 host.textContent="読み込み中…";
 $("status").textContent="KURO Admin APIへ接続中…";
 try{
  const d=await invoke({action:"get_quests"});
  const quests=Array.isArray(d.quests)?d.quests:[];
  $("status").textContent="通信OK：管理APIから"+quests.length+"件のクエストを取得しました";
  host.innerHTML=quests.map(q=>'<div class="item"><h3>'+esc(q.title)+'　'+(q.enabled?'🟢有効':'⚪停止')+'</h3><small>ID: '+esc(q.quest_key)+' / '+esc(q.event_key)+' / '+Number(q.condition_value||1)+'回 / '+q.xp_reward+' XP</small><p>'+esc(q.description)+'</p><div class="row"><button data-edit="'+esc(q.quest_key)+'">編集</button><button data-toggle="'+esc(q.quest_key)+'">'+(q.enabled?'停止':'有効化')+'</button><button data-delete="'+esc(q.quest_key)+'">削除</button></div></div>').join("")||"クエストはありません";
 }catch(e){
  $("status").textContent="通信失敗："+(e.message||String(e));
  host.innerHTML='<p class="status">読み込み失敗：'+esc(e.message)+'</p>';
 }
}function reset(){editing=null;$("form").reset();$("key").disabled=false;$("event").dispatchEvent(new Event("change"));$("enabled").checked=true;$("xp").value=100;$("conditionValue").value=1;$("formTitle").textContent="クエスト作成";$("status").textContent=""}function fill(q){editing=q.quest_key;$("key").value=q.quest_key;$("key").disabled=true;$("title").value=q.title;$("description").value=q.description;$("event").value=q.event_key;$("conditionValue").value=q.condition_value||1;$("xp").value=q.xp_reward;$("enabled").checked=q.enabled;$("formTitle").textContent="クエスト編集： "+q.quest_key;$("status").textContent="編集モード"}$("form").addEventListener("submit",async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;$("status").textContent="保存中…";try{await invoke({action:"save_quest",questKey:$("key").value,title:$("title").value,description:$("description").value,eventKey:$("event").value,conditionValue:Number($("conditionValue").value||1),xpReward:Number($("xp").value),enabled:$("enabled").checked});$("status").textContent="保存しました";reset();await load()}catch(err){$("status").textContent="保存失敗："+err.message}finally{b.disabled=false}});$("event").addEventListener("change",()=>{const counted=["post_count","game_play_count","game_win_count"].includes($("event").value);$("conditionWrap").style.display=counted?"block":"none";});$("event").dispatchEvent(new Event("change"));$("reset").onclick=reset;$("list").addEventListener("click",async e=>{const edit=e.target.closest("[data-edit]");if(edit){try{const d=await invoke({action:"get_quests"});fill((d.quests||[]).find(x=>x.quest_key===edit.dataset.edit))}catch(err){alert(err.message)}return}const toggle=e.target.closest("[data-toggle]");if(toggle){try{const d=await invoke({action:"get_quests"}),q=d.quests.find(x=>x.quest_key===toggle.dataset.toggle);await invoke({action:"save_quest",questKey:q.quest_key,title:q.title,description:q.description,eventKey:q.event_key,conditionValue:q.condition_value||1,xpReward:q.xp_reward,enabled:!q.enabled});await load()}catch(err){alert("更新失敗："+err.message)}return}const del=e.target.closest("[data-delete]");if(del&&confirm("このクエストを削除しますか？達成履歴も削除されます。")){try{await invoke({action:"delete_quest",questKey:del.dataset.delete});await load();reset()}catch(err){alert("削除失敗："+err.message)}}});db.auth.getUser().then(({data,error})=>{if(error||!data.user){$("status").textContent="管理者ログインが必要です。KURO Labで管理者アカウントにログインしてください。";$("form").style.display="none";return}load()})})();
</script></body></html>
