<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KURO QUEST</title><link rel="icon" href="/assets/brand/logo/kurolab_icon_maru_48.png"><style>*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#17243c;font-family:system-ui,sans-serif}.wrap{width:min(900px,calc(100% - 24px));margin:auto}header{background:#fff;border-bottom:1px solid #e5eaf2;padding:14px}header a{color:#536780;text-decoration:none;font-weight:900}main{padding:22px 0}.card{padding:19px;margin-bottom:14px;border:1px solid #e3e9f2;border-radius:17px;background:white}.hero{background:linear-gradient(120deg,#f1eaff,#f5f8ff);border-color:#ded5f8}.eyebrow{font-size:10px;font-weight:1000;letter-spacing:1.5px;color:#7654c9}h1{margin:6px 0;font-size:32px}p{color:#718098;font-size:12px;line-height:1.8}.levelrow{display:flex;align-items:center;gap:12px;margin-top:15px}.level{display:grid;place-items:center;width:62px;height:62px;border-radius:15px;background:linear-gradient(135deg,#7955d9,#4e85e5);color:#fff;font-size:23px;font-weight:1000}.xp{flex:1}.xp b{font-size:13px}.bar{height:8px;background:#e9edf5;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7955d9,#55a4ef)}small{display:block;margin-top:5px;color:#8592a5;font-size:10px}.questlist{display:grid;gap:9px}.quest{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid #e8edf5;border-radius:12px;background:#fcfdff}.icon{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:#f0ebff;font-size:20px}.questmain{flex:1;min-width:0}.questmain strong{font-size:12px}.questmain small{line-height:1.5}.reward{color:#7853ca;font-size:11px;font-weight:1000;white-space:nowrap}.done{padding:4px 7px;border-radius:99px;background:#e9f8ef;color:#208351;font-size:9px;font-weight:950}#status{margin-top:8px}@media(max-width:500px){.card{padding:14px}.quest{gap:7px;padding:10px}.icon{width:33px;height:33px}.reward{font-size:10px}}</style></head><body><header><div class="wrap"><a href="/games/">KURO GAMES</a>　<a href="/sns/v2/">KURO SNS</a></div></header><main class="wrap"><section class="card hero"><small class="eyebrow">KURO GAMES · QUEST</small><h1>クエスト</h1><p>ミッション達成で、いつものKuroGamesレベルを育てよう。</p><div class="levelrow"><div class="level" id="level">Lv.1</div><div class="xp"><b id="xpText">読み込み中…</b><div class="bar"><i id="progress"></i></div><small id="next">—</small></div></div><p id="status">進捗確認中…</p><p><a href="/games/quests/admin/" style="color:#8b73dc;font-size:11px">クエスト管理（管理者）</a></p></section><section class="card"><h2 style="margin:0 0 12px;font-size:17px">はじめてのクエスト</h2><div class="questlist" id="questlist">読み込み中…</div></section><section id="levelUp" style="display:none;position:fixed;inset:0;z-index:9999;background:#07101edb;place-items:center;padding:18px"><div style="max-width:440px;width:100%;text-align:center;border:1px solid #7559d9;border-radius:24px;padding:28px 20px;background:linear-gradient(145deg,#211544,#10253f);color:white;box-shadow:0 20px 90px #0008"><div style="font-size:12px;letter-spacing:4px;color:#b9a6ff;font-weight:900">KURO GAMES</div><div style="font-size:48px;font-weight:1000;margin:10px 0;animation:questPop .55s ease-out">LEVEL UP!</div><div id="levelUpLevel" style="font-size:34px;font-weight:1000"></div><p style="color:#d5d9f2">クエスト達成でレベルアップ！</p><button id="levelUpClose" style="border:0;border-radius:12px;padding:12px 20px;background:#9b83ff;color:#17102c;font-weight:900;cursor:pointer">続ける</button></div></section><style>@keyframes questPop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}</style></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const db=window.supabase?.createClient("https://cprvpphlfpmiegjiutjn.supabase.co","sb_publishable_BYPUfB0lrh26jV8_6ZQnpQ_wfAKOVyn",{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}}),status=document.getElementById("status"),list=document.getElementById("questlist"),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));try{if(!db)throw Error("DB unavailable");const{data:{user},error}=await db.auth.getUser();if(error)throw error;if(!user){status.textContent="ログインすると進捗を確認できます。";list.innerHTML='<p>ログインが必要です。<a href="/account/">ログインする</a></p>';return}status.textContent="ログイン中："+(user.email||"KUROユーザー");const [l,t,q,c]=await Promise.all([db.from("kuro_level_users").select("total_xp,current_level").eq("user_id",user.id).maybeSingle(),db.from("kuro_level_thresholds").select("level,required_xp").order("level"),db.from("kuro_quests").select("quest_key,title,description,xp_reward,event_key,condition_value").eq("enabled",true),db.from("kuro_quest_completions").select("quest_key,xp_awarded").eq("user_id",user.id)]);for(const r of[l,t,q,c])if(r.error)throw r.error;const total=Number(l.data?.total_xp||0),lv=Number(l.data?.current_level||1),ts=t.data||[],req=n=>{const x=ts.find(z=>+z.level===n);if(x)return+x.required_xp;const last=ts[ts.length-1]||{level:10,required_xp:10000},d=Math.max(0,n-Number(last.level));return Number(last.required_xp)+2000*d+100*d*(d+1)},cur=req(lv),next=req(lv+1);document.getElementById("level").textContent="Lv."+lv;document.getElementById("xpText").textContent=total.toLocaleString()+" XP";document.getElementById("progress").style.width=Math.max(0,Math.min(100,(total-cur)/(next-cur)*100))+"%";document.getElementById("next").textContent=(next-total).toLocaleString()+" XPで次のレベル";const ledger=await db.from("kuro_level_ledger").select("id,xp_amount,reason,total_xp_after,created_at").eq("user_id",user.id).order("created_at",{ascending:false}).limit(1).maybeSingle();if(!ledger.error&&ledger.data&&String(ledger.data.reason||"").startsWith("KURO QUEST達成：")){const entry=ledger.data,previous=Math.max(0,total-Number(entry.xp_amount||0));let prevLevel=1;for(const th of ts){if(Number(th.required_xp)<=previous)prevLevel=Number(th.level)}if(lv>prevLevel){const key="kuroquest_levelup_"+entry.id;if(!sessionStorage.getItem(key)){sessionStorage.setItem(key,"1");document.getElementById("levelUpLevel").textContent="LEVEL "+lv;const popup=document.getElementById("levelUp");popup.style.display="grid";document.getElementById("levelUpClose").onclick=()=>popup.style.display="none"}}}const done=new Set((c.data||[]).map(x=>x.quest_key)),icons={welcome:"👋",first_sns_post:"✍️"},conditionLabel=x=>({profile_created:"アカウント登録",first_post:"SNS初投稿",post_count:"SNS投稿 "+Number(x.condition_value||1)+"回",game_play_count:"ゲームプレイ "+Number(x.condition_value||1)+"回",game_win_count:"ゲーム勝利 "+Number(x.condition_value||1)+"回"}[x.event_key]||"条件達成");list.innerHTML=(q.data||[]).map(x=>'<div class="quest"><div class="icon">'+(icons[x.quest_key]||"🎯")+'</div><div class="questmain"><strong>'+esc(x.title)+'</strong><small>'+esc(x.description)+' · 条件：'+esc(conditionLabel(x))+'</small></div><span class="reward">+'+Number(x.xp_reward).toLocaleString()+' XP</span>'+(done.has(x.quest_key)?'<span class="done">達成</span>':'')+'</div>').join("")||"クエストはありません"}catch(e){console.warn("quest load error",e);status.textContent="読み込みに失敗しました。再読み込みしてください。";list.textContent="クエストを取得できませんでした"}})();</script></body></html>
