padding:10px}.icon{width:33px;height:33px}.reward{font-size:10px}}</style></head><body><header><div class="wrap"><a href="/games/">KURO GAMES</a>　<a href="/sns/v2/">KURO SNS</a></div></header><main class="wrap"><section class="card hero"><small class="eyebrow">KURO GAMES · QUEST</small><h1>クエスト</h1><p>ミッション達成で、いつものKuroGamesレベルを育てよう。</p><div class="levelrow"><div class="level" id="level">Lv.1</div><div class="xp"><b id="xpText">読み込み中…</b><div class="bar"><i id="progress"></i></div><small id="next">—</small></div></div><p id="status">進捗確認中…</p></section><section class="card"><h2 style="margin:0 0 12px;font-size:17px">はじめてのクエスト</h2><div class="questlist" id="questlist">読み込み中…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const db=window.supabase?.createClient("https://cprvpphlfpmiegjiutjn.supabase.co","sb_publishable_BYPUfB0lrh26jV8_6ZQnpQ_wfAKOVyn",{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}}),status=document.getElementById("status"),list=document.getElementById("questlist"),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));try{if(!db)throw Error("DB unavailable");const{data:{user},error}=await db.auth.getUser();if(error)throw error;if(!user){status.textContent="ログインすると進捗を確認できます。";list.innerHTML='<p>ログインが必要です。<a href="/account/">ログインする</a></p>';return}status.textContent="ログイン中："+(user.email||"KUROユーザー");const [l,t,q,c]=await Promise.all([db.from("kuro_level_users").select("total_xp,current_level").eq("user_id",user.id).maybeSingle(),db.from("kuro_level_thresholds").select("level,required_xp").order("level"),db.from("kuro_quests").select("quest_key,title,description,xp_reward").eq("enabled",true),db.from("kuro_quest_completions").select("quest_key,xp_awarded").eq("user_id",user.id)]);for(const r of[l,t,q,c])if(r.error)throw r.error;const total=Number(l.data?.total_xp||0),lv=Number(l.data?.current_level||1),ts=t.data||[],req=n=>{const x=ts.find(z=>+z.level===n);if(x)return+x.required_xp;const last=ts[ts.length-1]||{level:10,required_xp:10000},d=Math.max(0,n-Number(last.level));return Number(last.required_xp)+2000*d+100*d*(d+1)},cur=req(lv),next=req(lv+1);document.getElementById("level").textContent="Lv."+lv;document.getElementById("xpText").textContent=total.toLocaleString()+" XP";document.getElementById("progress").style.width=Math.max(0,Math.min(100,(total-cur)/(next-cur)*100))+"%";document.getElementById("next").textContent=(next-total).toLocaleString()+" XPで次のレベル";const done=new Set((c.data||[]).map(x=>x.quest_key)),icons={welcome:"👋",first_sns_post:"✍️"};list.innerHTML=(q.data||[]).map(x=>'<div class="quest"><div class="icon">'+(icons[x.quest_key]||"🎯")+'</div><div class="questmain"><strong>'+esc(x.title)+'</strong><small>'+esc(x.description)+'</small></div><span class="reward">+'+Number(x.xp_reward).toLocaleString()+' XP</span>'+(done.has(x.quest_key)?'<span class="done">達成</span>':'')+'</div>').join("")||"クエストはありません"}catch(e){console.warn("quest load error",e);status.textContent="読み込みに失敗しました。再読み込みしてください。";list.textContent="クエストを取得できませんでした"}})();</script></body></html>
