<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070b13">
  <meta name="robots" content="noindex,nofollow">
  <title>ゲームを起動中 | KURO GAMES MOBILE</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:#070b13;color:#edf4ff;font-family:system-ui,sans-serif}
    body{display:grid;place-items:center;padding:24px;text-align:center}
    main{max-width:360px}
    p{color:#9aaac2;font-size:13px;line-height:1.8}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-top:10px;padding:0 18px;border:1px solid #516b94;border-radius:12px;background:#1a2a43;color:#f0f5ff;font-weight:800;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <strong>ゲームを起動しています</strong>
    <p>ゲーム画面へ直接移動します。</p>
    <a id="gameLink" href="/games/mobile/">ゲームを開く</a>
  </main>
  <script>
  (function(){
    "use strict";
    var id=new URLSearchParams(location.search).get("id")||"";
    if(!/^[0-9a-f-]{36}$/i.test(id)){
      location.replace("/games/mobile/");
      return;
    }
    var target="/games/play/?id="+encodeURIComponent(id)+"&mobileApp=1";
    document.getElementById("gameLink").href=target;
    location.replace(target);
  })();
  </script>
</body>
</html>
