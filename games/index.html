/* KURO GAMES ranking layout — original compact sidebar dimensions */
.games-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(260px,300px);
  gap:18px;
  align-items:start;
}
.games-layout > .grid{min-width:0}
#kuroRankingShowcase{
  width:100%;
  max-width:300px;
  margin:0;
  justify-self:stretch;
}
#kuroRankingShowcase .rank-list{min-height:0}
@media(max-width:980px){
  .games-layout{grid-template-columns:minmax(0,1fr) 260px;gap:13px}
}
@media(max-width:680px){
  .games-layout{display:flex;flex-direction:column;gap:14px}
  .games-layout > #kuroRankingShowcase{
    order:-1;
    width:100%;
    max-width:460px;
    margin:0 auto 12px;
  }
  .games-layout > .grid{width:100%}
}

/* ===== KURO Ranking Showcase v3 : Award Ceremony (light) ===== */

.ranking-showcase{
  --ink:#0f1b3d;
  --gold:#e8b923;
  --gold-hi:#f5c542;
  --red:#e5322d;
  --silver:#9aa6b8;
  --bronze:#c9824a;

  position:relative;
  overflow:hidden;
  max-width:460px;
  margin:0 auto;
  padding:0;
  border-radius:20px;
  color:var(--ink);
  background:#fff;
  border:1px solid #dde2ee;
  box-shadow:0 22px 44px rgba(15,27,61,.14),0 3px 8px rgba(15,27,61,.08);
  transition:opacity .18s ease,transform .18s ease,filter .18s ease;
  isolation:isolate;
}
.ranking-showcase > :not(.rank-cinema-layer):not(.rank-bg):not(.rank-progress):not(.rank-shutter){
  position:relative;z-index:1;
}

/* ---- 背景: ゆっくり流れるレーシングストライプ ---- */
.rank-bg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.rank-stripes{
  position:absolute;inset:-40px;
  background:repeating-linear-gradient(-55deg,rgba(15,27,61,.03) 0 12px,transparent 12px 24px);
  animation:stripeMove 3.5s linear infinite;
}
@keyframes stripeMove{to{transform:translate(-19.66px,-13.77px)}}

/* ---- 切り替え / 衝撃 ---- */
.rank-out .rank-row,.rank-out .rank-game{animation:itemOut .34s cubic-bezier(.5,0,.8,.4) both}
.rank-out .rank-row{animation-delay:calc((2 - var(--i,0))*70ms)} /* 1位から順に退場 */
@keyframes itemOut{
  to{opacity:0;transform:translateX(calc(var(--dir,1)*-70px)) skewX(calc(var(--dir,1)*8deg))}
}
.rank-in .rank-empty{animation:fadeUp .4s ease backwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}}
.ranking-showcase.rank-shake{animation:panelShake .42s ease}
@keyframes panelShake{
  0%,100%{translate:0 0}
  15%{translate:-4px 3px}30%{translate:4px -3px}
  45%{translate:-3px 2px}60%{translate:3px -1px}80%{translate:-1px 1px}
}

/* ---- ヘッダー(紺の帯 + 金のライン) ---- */
.rank-head{
  position:relative;overflow:hidden;
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:20px 20px 48px;
  background:linear-gradient(177deg,
    var(--ink) 0,var(--ink) calc(100% - 26px),
    var(--gold-hi) calc(100% - 26px),var(--gold-hi) calc(100% - 15px),
    transparent calc(100% - 15px));
}
.rank-head > *{position:relative}
.rank-head::before{
  content:"";position:absolute;top:0;bottom:0;width:80px;left:-140px;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.2),transparent);
  transform:skewX(-20deg);animation:shine 4.2s ease-in-out infinite 1s;
}
.rank-head h2{display:flex;align-items:center;gap:10px}
.rank-ico-trophy{
  width:32px;height:32px;flex:none;transform-origin:50% 90%;
  filter:drop-shadow(2px 2px 0 rgba(0,0,0,.3));
  animation:trophyTilt 3.2s ease-in-out infinite;
}
@keyframes trophyTilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg) translateY(-1px)}}
.rank-eyebrow{font-size:10px;letter-spacing:.28em;font-weight:800;color:var(--gold-hi);margin-bottom:5px}
.rank-head h2{
  margin:0;font-size:27px;font-weight:900;font-style:italic;letter-spacing:.04em;color:#fff;
  text-shadow:2px 2px 0 rgba(0,0,0,.3);
}

.rank-live{
  position:relative;
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:4px;
  font-size:10px;font-weight:900;letter-spacing:.16em;color:#fff;
  background:linear-gradient(100deg,var(--red) 38%,#ff8a80 50%,var(--red) 62%);
  background-size:260% 100%;
  text-shadow:0 0 8px rgba(255,255,255,.7);
  animation:liveGlow 1.5s ease-in-out infinite,liveFlow 2.6s linear infinite;
}
.rank-live::after{ /* 外へ広がる波紋 */
  content:"";position:absolute;inset:0;border-radius:inherit;
  border:2px solid #ff6a60;pointer-events:none;
  animation:liveRipple 1.5s ease-out infinite;
}
.rank-live i{
  width:7px;height:7px;border-radius:50%;background:#fff;
  box-shadow:0 0 8px 2px rgba(255,255,255,.9);
  animation:blink 1.1s ease-in-out infinite;
}
@keyframes liveGlow{
  0%,100%{box-shadow:0 2px 0 rgba(0,0,0,.25),0 0 6px 1px rgba(255,80,70,.55)}
  50%{box-shadow:0 2px 0 rgba(0,0,0,.25),0 0 15px 5px rgba(255,100,90,.95)}
}
@keyframes liveFlow{to{background-position:-260% 0}}
@keyframes liveRipple{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.45,1.9)}}
@keyframes blink{50%{opacity:.3;transform:scale(.7)}}

/* ---- ゲーム名 ---- */
.rank-game{
  margin:2px 18px 14px;font-size:16px;font-weight:800;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.rank-game::before{
  content:"GAME";display:inline-block;vertical-align:middle;margin-right:10px;
  padding:3px 8px;border-radius:3px;font-size:10px;font-weight:900;letter-spacing:.16em;
  color:#fff;background:var(--ink);
}
.rank-in .rank-game{animation:titleIn .55s cubic-bezier(.2,.9,.3,1) calc(.1s + var(--rv,0ms)) backwards}
@keyframes titleIn{from{opacity:0;transform:translateX(calc(var(--dir,1)*30px))}to{opacity:1;transform:none}}

/* ---- リスト ---- */
.rank-list{
  display:flex;flex-direction:column;gap:11px;min-height:206px;margin:0 18px;
  transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition:transform .18s ease-out;
}
.rank-row{
  --c:var(--silver);
  --sc:#566175;
  position:relative;overflow:hidden;
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;
  min-height:68px;padding:0 16px 0 0;border-radius:14px;
  background:#fff;border:1px solid #e1e6f0;box-shadow:0 3px 0 #e6eaf3;
  transition:transform .25s ease,box-shadow .25s ease;
}
.rank-row > :not(.rank-ray){position:relative;z-index:1}
.rank-row::before{display:none}
.rank-row:hover{transform:translateY(-2px);box-shadow:0 5px 0 #e1e6f0}
.rank-row.rank-2{--c:var(--silver);--sc:#566175}
.rank-row.rank-3{--c:var(--bronze);--sc:#9a5a2a}
.rank-row.rank-1{
  --c:var(--gold);--sc:#b07800;
  min-height:98px;padding:0 18px 0 0;
  background:linear-gradient(100deg,#fff1bd,#fffbea 55%,#fff);
  border-color:#e8c25a;
  box-shadow:0 4px 0 #e2b93e,0 16px 30px rgba(232,185,35,.28);
}
/* 1位: ゆっくり回るサンバースト */
.rank-ray{
  position:absolute;left:-40px;top:50%;width:300px;height:300px;margin-top:-150px;
  border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(rgba(232,185,35,.26) 0 7deg,transparent 7deg 22deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 68%);
  mask:radial-gradient(circle,#000 0,transparent 68%);
  animation:raySpin 14s linear infinite;
}
@keyframes raySpin{to{transform:rotate(360deg)}}
.rank-row.rank-1::after{
  content:"";position:absolute;top:0;bottom:0;width:70px;left:-100px;z-index:2;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.85),transparent);
  transform:skewX(-20deg);animation:shine 3.4s ease-in-out infinite 1.8s;
}
@keyframes shine{0%{left:-140px}40%,100%{left:125%}}

/* 順位プレート(斜め・全高) */
.rank-medal{
  position:relative;overflow:hidden;align-self:stretch;width:68px;padding-right:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:
    repeating-linear-gradient(-55deg,rgba(255,255,255,.16) 0 6px,transparent 6px 12px),
    linear-gradient(160deg,#cdd6e4,#8693a8);
  clip-path:polygon(0 0,100% 0,calc(100% - 18px) 100%,0 100%);
}
.rank-medal b{
  font-size:34px;font-weight:900;font-style:italic;line-height:1;color:#fff;
  text-shadow:2px 2px 0 rgba(15,27,61,.3);
}
.rank-medal svg{width:24px;height:24px;margin-bottom:3px;fill:#fff;filter:drop-shadow(1px 2px 0 rgba(107,70,0,.45))}
.rank-1 .rank-medal{
  width:96px;
  background:
    repeating-linear-gradient(-55deg,rgba(255,255,255,.2) 0 6px,transparent 6px 12px),
    linear-gradient(160deg,#fbd964,#d29a12);
}
.rank-1 .rank-medal b{font-size:50px}
.rank-3 .rank-medal{
  background:
    repeating-linear-gradient(-55deg,rgba(255,255,255,.16) 0 6px,transparent 6px 12px),
    linear-gradient(160deg,#e3a173,#a9622f);
}
.rank-1 .rank-medal::after{
  content:"";position:absolute;top:0;bottom:0;width:30px;left:-80px;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.8),transparent);
  transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite 2s;
}

.rank-name{display:flex;align-items:center;gap:8px;min-width:0;font-weight:800;font-size:16px;color:var(--ink)}
.rank-nm{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-1 .rank-name{font-size:19px;flex-direction:column;align-items:flex-start;gap:5px}
.rank-tag{ /* 赤いリボン */
  flex:none;font-style:normal;font-size:9px;font-weight:900;letter-spacing:.14em;
  padding:4px 12px 4px 8px;color:#fff;background:var(--red);
  clip-path:polygon(0 0,100% 0,calc(100% - 6px) 50%,100% 100%,0 100%);
  animation:tagPulse 2.2s ease-in-out infinite;
}
@keyframes tagPulse{50%{filter:brightness(1.18)}}

.rank-score{
  font-variant-numeric:tabular-nums;font-weight:900;font-style:italic;font-size:19px;color:var(--sc);
}
.rank-1 .rank-score{font-size:26px}
.rank-score.pop{animation:scorePop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes scorePop{40%{transform:scale(1.28)}}

/* 登場: 3位 → 2位 → 1位(--i が小さいほど先) */
.rank-in .rank-row{
  animation:rowIn .55s cubic-bezier(.2,1.1,.3,1) calc(var(--i,0)*140ms + 150ms + var(--rv,0ms)) backwards;
}
.rank-in .rank-row.rank-1{
  animation:slam1 .85s cubic-bezier(.2,1.1,.3,1) calc(var(--i,0)*140ms + 150ms + var(--rv,0ms)) backwards,
            lift1 2.2s ease-in-out 2s infinite alternate;
}
.rank-in .rank-medal{
  animation:plateIn .6s cubic-bezier(.2,1.2,.3,1) calc(var(--i,0)*140ms + 250ms + var(--rv,0ms)) backwards;
}
.rank-in .rank-medal b{
  animation:numPop .5s cubic-bezier(.2,1.9,.4,1) calc(var(--i,0)*140ms + 520ms + var(--rv,0ms)) backwards;
}
@keyframes rowIn{
  from{opacity:0;transform:translateX(calc(var(--dir,1)*70px)) skewX(calc(var(--dir,1)*-10deg))}
  to{opacity:1;transform:none}
}
@keyframes slam1{
  0%{opacity:0;transform:translateY(-26px) scale(1.4)}
  55%{opacity:1;transform:scale(.95)}
  75%{transform:scale(1.03)}
  100%{transform:none}
}
@keyframes lift1{
  from{box-shadow:0 4px 0 #e2b93e,0 16px 30px rgba(232,185,35,.28)}
  to{box-shadow:0 6px 0 #e2b93e,0 22px 40px rgba(232,185,35,.42)}
}
@keyframes plateIn{from{transform:translateX(-110%)}to{transform:none}}
@keyframes numPop{from{transform:scale(0) rotate(-20deg)}to{transform:none}}

.rank-empty{padding:48px 10px;text-align:center;font-size:13px;font-weight:700;color:#6b7390}

/* ---- フッター ---- */
.rank-foot{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:16px 18px 0;padding:14px 0 18px;border-top:1px solid #e8ecf4;
}
.rank-foot a{
  position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;
  padding:10px 18px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.04em;
  text-decoration:none;color:#fff;background:var(--ink);
  box-shadow:0 3px 0 #05091c;
  animation:ctaBeat 2.6s ease-in-out infinite;
  transition:background .2s,transform .15s,box-shadow .15s;
}
.rank-foot a::after{
  content:"";position:absolute;top:0;bottom:0;width:30px;left:-60px;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);
  transform:skewX(-20deg);animation:shine 3.4s ease-in-out infinite;
}
@keyframes ctaBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.rank-foot a svg{width:11px;height:11px;fill:currentColor;transition:transform .2s}
.rank-foot a:hover svg{transform:translateX(3px)}
.rank-foot a:hover{animation:none;background:var(--red);transform:translateY(-2px);box-shadow:0 5px 0 #8c1814}
.rank-foot a:active{transform:translateY(2px);box-shadow:0 1px 0 #05091c}

.rank-controls{display:flex;align-items:center;gap:8px}
.rank-controls button{
  width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1;
  color:var(--ink);background:#fff;border:1.5px solid #cdd4e4;
  transition:background .2s,color .2s,transform .15s;
}
.rank-controls button{display:grid;place-items:center;padding:0}
.rank-controls button svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.rank-controls button:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.rank-controls button:active{transform:scale(.88)}
#kuroRankDots{display:inline-flex;align-items:center;gap:6px}
#kuroRankDots > *{
  display:block;width:7px;height:7px;padding:0;border:0;border-radius:99px;
  background:#cdd4e4;cursor:pointer;transition:width .3s,background .3s;
}
#kuroRankDots > .active,#kuroRankDots > .is-active,#kuroRankDots > [aria-current="true"]{
  width:24px;background:var(--ink);
}

/* 次の切り替えまでのプログレスバー */
.rank-progress{position:absolute;left:0;right:0;bottom:0;height:4px;background:#eef1f7;z-index:5}
.rank-progress i{
  display:block;height:100%;transform-origin:left;
  background:linear-gradient(90deg,var(--gold-hi),var(--red));
  animation:progress var(--dur,5s) linear forwards;
}
@keyframes progress{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ===== シネマ演出(切り替えスティング + 1位発表) ===== */
.rank-cinema-layer{
  position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;
  --cine-delay:.86s;--cy:48%;
}

/* スポットライト */
.rank-cinema-beam{
  position:absolute;top:196px;left:50%;width:300px;height:calc(100% - 196px);margin-left:-150px;opacity:0;
  background:linear-gradient(to bottom,rgba(255,222,110,.6),rgba(255,222,110,0) 85%);
  clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);
}
.rank-cinema .rank-cinema-beam{animation:beam 1.6s ease-out calc(var(--cine-delay) - .25s) both}
@keyframes beam{0%{opacity:0}25%{opacity:1}100%{opacity:0}}

.rank-cinema-flare,.rank-cinema-burst,.rank-cinema-ring{
  position:absolute;left:50%;top:var(--cy);opacity:0;border-radius:50%;
}
.rank-cinema-flare{
  width:440px;height:440px;margin:-220px 0 0 -220px;
  background:radial-gradient(circle,rgba(255,214,90,.5),rgba(255,214,90,.16) 40%,transparent 68%);
}
.rank-cinema-burst{ /* 衝撃のスピードライン */
  width:340px;height:340px;margin:-170px 0 0 -170px;
  background:repeating-conic-gradient(var(--gold) 0 4deg,transparent 4deg 15deg);
  -webkit-mask:radial-gradient(circle,transparent 0 24%,#000 26%,transparent 70%);
  mask:radial-gradient(circle,transparent 0 24%,#000 26%,transparent 70%);
}
.rank-cinema-ring{
  width:120px;height:120px;margin:-60px 0 0 -60px;border:4px solid var(--gold);
}
.rank-cinema-ring.r2{border:2px solid var(--ink)}
.rank-cinema .rank-cinema-flare{animation:cineFlare 1s ease-out var(--cine-delay) both}
.rank-cinema .rank-cinema-burst{animation:cineBurst .75s cubic-bezier(.15,.8,.3,1) var(--cine-delay) forwards}
.rank-cinema .rank-cinema-ring{animation:cineRing .9s cubic-bezier(.15,.8,.3,1) var(--cine-delay) forwards}
.rank-cinema .rank-cinema-ring.r2{animation-delay:calc(var(--cine-delay) + .12s)}
@keyframes cineFlare{0%{opacity:0;transform:scale(.3)}25%{opacity:1}100%{opacity:0;transform:scale(1.3)}}
@keyframes cineBurst{0%{opacity:1;transform:scale(.25) rotate(0)}100%{opacity:0;transform:scale(1.35) rotate(18deg)}}
@keyframes cineRing{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(4)}}

/* 紙吹雪 */
.rank-confetti{
  position:absolute;top:-16px;left:var(--cx);width:var(--cw);height:calc(var(--cw)*var(--ch,1.7));
  background:var(--cc);border-radius:var(--cb,1px);opacity:0;
  animation:confFall var(--cdur) cubic-bezier(.3,.55,.4,1) calc(var(--cine-delay) + var(--cdl)) both;
}
@keyframes confFall{
  0%{opacity:0;transform:translate3d(0,0,0) rotateX(0) rotateZ(0)}
  8%{opacity:1}
  85%{opacity:1}
  100%{opacity:0;transform:translate3d(var(--cdx),560px,0) rotateX(720deg) rotateZ(var(--cr))}
}

/* ===== ゲーム切り替えのシャッター演出 =====
   rank-cover  : 帯が降りて画面を覆い、ゲーム名カードが出る(データが届くまで閉じたまま待つ)
   rank-reveal : 帯が下へ抜けて新しい中身が現れる */
.rank-shutter{position:absolute;top:0;bottom:0;left:-15%;right:-15%;z-index:6;pointer-events:none;overflow:hidden;display:none}
.rank-cover .rank-shutter{display:block}
.rank-shutter i{
  position:absolute;top:-3%;bottom:-3%;left:calc(var(--n)*12.5%);width:20%;
  background:var(--sc,#0f1b3d);
  transform:translateY(-106%) skewX(-12deg);
}
.rank-cover .rank-shutter i{animation:shutterIn .45s cubic-bezier(.2,.9,.3,1) calc(var(--k,0)*35ms) both}
.rank-reveal .rank-shutter i{animation:shutterOut .5s cubic-bezier(.7,0,.9,.5) calc(var(--k,0)*35ms) both}
@keyframes shutterIn{from{transform:translateY(-106%) skewX(-12deg)}to{transform:translateY(0) skewX(-12deg)}}
@keyframes shutterOut{from{transform:translateY(0) skewX(-12deg)}to{transform:translateY(106%) skewX(-12deg)}}

.rank-card{
  position:absolute;left:50%;top:50%;width:max-content;max-width:74%;
  padding:14px 36px 15px;text-align:center;color:#fff;background:var(--ink);
  border-top:4px solid var(--gold-hi);border-bottom:4px solid var(--red);
  box-shadow:0 14px 34px rgba(0,0,0,.35);
  transform:translate(-50%,-50%) skewX(-12deg) scale(1.7);opacity:0;
}
.rank-cover .rank-card{animation:cardIn .5s cubic-bezier(.2,1.3,.4,1) .3s both}
.rank-reveal .rank-card{animation:cardOut .4s ease-in both}
.rank-card small{display:block;font-size:10px;font-weight:900;letter-spacing:.34em;color:var(--gold-hi);margin-bottom:5px}
.rank-card b{display:block;font-size:30px;font-weight:900;font-style:italic;line-height:1.15;letter-spacing:.02em;text-shadow:2px 2px 0 rgba(0,0,0,.35)}
.rank-card em{display:block;margin-top:6px;font-style:normal;font-size:12px;font-weight:800;letter-spacing:.2em;color:#b9c3dc}
@keyframes cardIn{
  from{opacity:0;transform:translate(-50%,-50%) skewX(-12deg) scale(1.7)}
  to{opacity:1;transform:translate(-50%,-50%) skewX(-12deg) scale(1)}
}
@keyframes cardOut{
  from{opacity:1;transform:translate(-50%,-50%) skewX(-12deg) scale(1)}
  to{opacity:0;transform:translate(-50%,-50%) skewX(-12deg) translateX(60px) scale(.92)}
}

@media (max-width:420px){

  .ranking-showcase:not(.fx-force) .rank-shutter{display:none!important}
}

<script>

function initKuroRankingShowcase(){
 const panel=document.getElementById("kuroRankingShowcase");
 const listEl=document.getElementById("kuroRankList");
 const titleEl=document.getElementById("kuroRankGame");
 const linkEl=document.getElementById("kuroRankGameLink");
 const dotsEl=document.getElementById("kuroRankDots");
 const prev=document.getElementById("kuroRankPrev");
 const next=document.getElementById("kuroRankNext");
 if(!panel||!listEl||!titleEl||!linkEl||!dotsEl)return;

 let games=[],index=0,busy=false,cache=new Map();
 let rankHoverPaused=false;

 function esc(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 }
 function renderDots(){
  dotsEl.innerHTML=games.map((game,i)=>
   '<button type="button" class="rank-dot '+(i===index?'active':'')+'" data-rank-index="'+i+'" aria-label="'+(i+1)+'番目のランキング" aria-current="'+(i===index?'true':'false')+'"></button>'
  ).join("");
 }
 function showMessage(msg){
  listEl.innerHTML='<div class="rank-empty">'+esc(msg)+'</div>';
 }
 async function fetchRanking(game){
  const key=game.id+"::"+game.mode;
  if(cache.has(key))return cache.get(key);
  const {data,error}=await kuroGamesDB.functions.invoke("kurogames-online",{
   body:{action:"leaderboard",gameId:game.id,mode:game.mode,limit:3}
  });
  if(error)throw error;
  const rows=Array.isArray(data?.scores)?data.scores:[];
  cache.set(key,rows);
  return rows;
 }
 function modeName(mode){
  return mode==="default"?"":String(mode||"").replace(/[_-]+/g," ");
 }

/* ===== KURO Ranking FX v3 (Award Ceremony) =====
   既存の display / playCinema / setInterval / go をこのファイルの内容に差し替える。
   前提の変数: panel, titleEl, listEl, linkEl, games, index, busy,
               esc, modeName, fetchRanking, renderDots, showMessage, prev, next
   (medals 配列は不要になった。メダルはCSSで描画する) */

// OSの「視差効果を減らす / アニメーションを減らす」がONだと演出は自動で止まる。
// 演出を常に見せたいなら true にする(確認用)。
const RANK_FORCE_FX=false;
const RANK_REDUCED=!RANK_FORCE_FX&&matchMedia("(prefers-reduced-motion: reduce)").matches;
const rankRand=(a,b)=>a+Math.random()*(b-a);

let rankTimer=null;        // 自動切り替えタイマー
let rankNextDelay=5000;    // 次の切り替えまでの待ち時間(演出が約2.5秒あるので長め。手動操作後はさらに長く)
let rankShakeTimer=null;
let rankCountToken=0;
let rankCovering=false;    // シャッター演出中は次の切り替えを受け付けない
let rankCoverTimer=null;
let rankDir=1;             // 1: 次へ(左へ流れる) / -1: 前へ(右へ流れる)

/* ---------- アイコン(SVG) ---------- */
const ICON_TROPHY='<svg class="rank-ico-trophy" viewBox="0 0 32 32" aria-hidden="true">'+
  '<path d="M9 4h14v8a7 7 0 0 1-14 0V4z" fill="#f5c542"/>'+
  '<path d="M9 7H5v2.5A4.5 4.5 0 0 0 9.6 14M23 7h4v2.5a4.5 4.5 0 0 1-4.6 4.5" fill="none" stroke="#e8b923" stroke-width="2.2" stroke-linecap="round"/>'+
  '<path d="M14 19h4v4h-4z" fill="#e8b923"/><rect x="9" y="23" width="14" height="4" rx="1.5" fill="#f5c542"/>'+
  '<path d="M12.5 6.5v6" stroke="#fff" stroke-opacity=".75" stroke-width="2" stroke-linecap="round"/></svg>';
const ICON_CROWN='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5l4.6 4.2L12 4.5l4.4 7.2L21 7.5 19 19H5L3 7.5z"/></svg>';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ICON_PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5v17a1 1 0 0 0 1.5.86l14-8.5a1 1 0 0 0 0-1.72l-14-8.5A1 1 0 0 0 6 3.5z"/></svg>';
const ICON_PREV='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
const ICON_NEXT='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';

/* ---------- 初回だけ: 背景・プログレスバー・チルト ---------- */
function ensureFx(){
  if(panel.dataset.fxReady==="1")return;
  panel.dataset.fxReady="1";
  if(RANK_FORCE_FX)panel.classList.add("fx-force");

  const bg=document.createElement("div");
  bg.className="rank-bg";
  bg.setAttribute("aria-hidden","true");
  bg.innerHTML='<span class="rank-stripes"></span>';
  panel.prepend(bg);

  const bar=document.createElement("div");
  bar.className="rank-progress";
  bar.setAttribute("aria-hidden","true");
  bar.innerHTML="<i></i>";
  panel.appendChild(bar);

  // 切り替え用のシャッター(斜めの帯 + ゲーム名カード)
  const sh=document.createElement("div");
  sh.className="rank-shutter";
  sh.setAttribute("aria-hidden","true");
  const cols=["#0f1b3d","#0f1b3d","#f5c542","#0f1b3d","#e5322d","#0f1b3d","#0f1b3d","#0f1b3d"];
  sh.innerHTML=cols.map((c,i)=>'<i style="--n:'+i+';--sc:'+c+'"></i>').join("")+'<div class="rank-card"></div>';
  panel.appendChild(sh);

  const h2=panel.querySelector(".rank-head h2");
  if(h2)h2.innerHTML=ICON_TROPHY+"<span>ランキング</span>";
  if(prev){prev.innerHTML=ICON_PREV;prev.setAttribute("aria-label","前のゲーム")}
  if(next){next.innerHTML=ICON_NEXT;next.setAttribute("aria-label","次のゲーム")}

  if(RANK_REDUCED)return;

  // マウス追従: リストの3Dチルト
  panel.addEventListener("pointermove",e=>{
    const r=panel.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width;
    const y=(e.clientY-r.top)/r.height;
    listEl.style.setProperty("--rx",((.5-y)*5)+"deg");
    listEl.style.setProperty("--ry",((x-.5)*7)+"deg");
  });
  panel.addEventListener("pointerleave",()=>{
    listEl.style.setProperty("--rx","0deg");
    listEl.style.setProperty("--ry","0deg");
  });
}

/* ---------- 行の描画 (3位→2位→1位の順に登場) ---------- */
function renderRows(rows){
  const n=rows.length;
  return rows.map((row,ri)=>{
    const name=esc(row.user?.username||row.user?.display_name||"プレイヤー");
    const score=Number(row.score||0);
    return '<div class="rank-row rank-'+(ri+1)+'" style="--i:'+(n-1-ri)+'">'+
      (ri===0?'<span class="rank-ray"></span>':'')+
      '<span class="rank-medal">'+(ri===0?ICON_CROWN:'')+'<b>'+(ri+1)+'</b></span>'+
      '<span class="rank-name"><b class="rank-nm">'+name+'</b>'+
        (ri===0?'<em class="rank-tag">CHAMPION</em>':'')+'</span>'+
      '<span class="rank-score" data-score="'+score+'">'+
        score.toLocaleString("ja-JP")+'</span></div>';
  }).join("");
}

/* ---------- スコアのカウントアップ ---------- */
function runCounts(){
  const token=++rankCountToken;
  if(RANK_REDUCED)return;

  listEl.querySelectorAll(".rank-score").forEach(el=>{
    const to=Number(el.dataset.score)||0;
    if(to<=0)return;
    const order=Number(el.closest(".rank-row").style.getPropertyValue("--i"))||0;
    const delay=order*140+350+(parseInt(panel.style.getPropertyValue("--rv"))||0);
    const dur=900+Math.min(to,100000)/100000*500;

    el.textContent="0";
    setTimeout(()=>{
      if(token!==rankCountToken)return;
      const t0=performance.now();
      const step=now=>{
        if(token!==rankCountToken)return;
        const p=Math.min((now-t0)/dur,1);
        const eased=1-Math.pow(1-p,3);
        el.textContent=Math.round(to*eased).toLocaleString("ja-JP");
        if(p<1){
          requestAnimationFrame(step);
        }else{
          el.classList.add("pop");
          setTimeout(()=>el.classList.remove("pop"),500);
        }
      };
      requestAnimationFrame(step);
    },delay);
  });
}

/* ---------- 演出: ワイプ → (1位着地の瞬間に)スポットライト・衝撃・紙吹雪 ---------- */
function playCinema(){
  let layer=panel.querySelector(".rank-cinema-layer");
  if(!layer){
    layer=document.createElement("div");
    layer.className="rank-cinema-layer";
    layer.setAttribute("aria-hidden","true");
    ["beam","flare","burst","ring","ring r2"].forEach(n=>{
      const s=document.createElement("span");
      s.className="rank-cinema-"+n;
      layer.appendChild(s);
    });
    panel.prepend(layer);
  }
  if(RANK_REDUCED)return;

  layer.querySelectorAll(".rank-confetti").forEach(n=>n.remove());

  // 1位が着地する時刻 = (行数-1)*140 + 150(登場ディレイ) + 約470(着地まで)
  const n=listEl.querySelectorAll(".rank-row").length;
  const rv=parseInt(panel.style.getPropertyValue("--rv"))||0;
  const impact=(n-1)*140+150+470+rv;
  layer.style.setProperty("--cine-delay",impact+"ms");

  // 衝撃の中心 = 1位の行の中央
  const pr=panel.getBoundingClientRect();
  const lr=listEl.getBoundingClientRect();
  const r1=listEl.querySelector(".rank-1");
  if(r1)layer.style.setProperty("--cy",(lr.top-pr.top+r1.offsetHeight/2)+"px");

  // 紙吹雪(フラットな紙片。丸・細長いものも混ぜる)
  const colors=["#e8b923","#e5322d","#0f1b3d","#2f7dff","#14a76c","#ff8a1f","#ffffff"];
  for(let i=0;i<40;i++){
    const c=document.createElement("span");
    c.className="rank-confetti";
    const round=i%5===0;
    c.style.setProperty("--cx",rankRand(4,96)+"%");
    c.style.setProperty("--cw",(round?rankRand(6,9):rankRand(5,9))+"px");
    c.style.setProperty("--ch",round?1:rankRand(1.4,2.6));
    c.style.setProperty("--cb",round?"50%":"1px");
    c.style.setProperty("--cc",colors[i%colors.length]);
    c.style.setProperty("--cdx",rankRand(-60,60)+"px");
    c.style.setProperty("--cr",rankRand(-540,540)+"deg");
    c.style.setProperty("--cdl",rankRand(0,.5)+"s");
    c.style.setProperty("--cdur",rankRand(1.7,2.8)+"s");
    layer.appendChild(c);
  }

  panel.classList.remove("rank-cinema");
  void panel.offsetWidth;
  panel.classList.add("rank-cinema");

  // 1位着地の瞬間に画面を揺らす
  clearTimeout(rankShakeTimer);
  panel.classList.remove("rank-shake");
  rankShakeTimer=setTimeout(()=>{
    panel.classList.add("rank-shake");
    setTimeout(()=>panel.classList.remove("rank-shake"),440);
  },impact);
}

/* ---------- 自動切り替え + プログレスバー ---------- */
function restartProgress(ms){
  const bar=panel.querySelector(".rank-progress");
  if(!bar)return;
  const i=bar.firstElementChild;
  bar.style.setProperty("--dur",ms+"ms");
  i.style.animation="none";
  void i.offsetWidth;
  i.style.animation="";
}
function schedule(ms){
  clearTimeout(rankTimer);
  restartProgress(ms);
  if(rankHoverPaused)return;
  rankTimer=setTimeout(()=>{
    if(rankHoverPaused)return;
    if(busy||rankCovering){schedule(400);return;}   // 切り替え中なら少し待つ
    display(index+1);
  },ms);
}
// 手動操作: 12秒は自動切り替えを止める(プログレスバーもゆっくり進む)
function go(delta){
  rankNextDelay=12000;
  rankDir=delta<0?-1:1;
  display(index+delta);
}
prev?.addEventListener("click",()=>go(-1));
next?.addEventListener("click",()=>go(1));

/* ---------- 切り替えシャッター ----------
   1) 帯が降りて画面を覆い、ゲーム名カードが出る(データが届くまで閉じたまま待つ)
   2) 中身を入れ替えてから、帯が抜けて新しいランキングが現れる */
function startCover(game,dir){
  const sh=panel.querySelector(".rank-shutter");
  if(!sh)return;
  const strips=sh.querySelectorAll("i");
  strips.forEach((el,i)=>el.style.setProperty("--k",dir===1?i:strips.length-1-i));
  sh.querySelector(".rank-card").innerHTML=
    '<small>NEXT GAME</small><b>'+esc(game.title)+'</b>'+
    (modeName(game.mode)?'<em>'+esc(modeName(game.mode))+'</em>':'');
  rankCovering=true;
  panel.classList.remove("rank-cover","rank-reveal");
  void panel.offsetWidth;
  panel.classList.add("rank-cover");
  // 万一の保険: 6秒たっても終わらなければ強制的に片付ける
  clearTimeout(rankCoverTimer);
  rankCoverTimer=setTimeout(endCover,6000);
}
function revealCover(){
  panel.classList.add("rank-reveal");
  clearTimeout(rankCoverTimer);
  rankCoverTimer=setTimeout(endCover,950);
}
function endCover(){
  panel.classList.remove("rank-cover","rank-reveal");
  rankCovering=false;
}

/* ---------- display (差し替え版) ---------- */
async function display(i){
  if(!games.length||busy||rankCovering)return;
  busy=true;
  ensureFx();

  // 流れる向き: 前へなら逆向き。ドットなどから直接呼ばれた場合は番号の大小で決める
  const dir=rankDir===-1?-1:(i<index?-1:1);
  panel.style.setProperty("--dir",dir);
  const nextIndex=(i+games.length)%games.length;
  const isSwitch=panel.dataset.rankReady==="1"&&nextIndex!==index;
  const fancy=isSwitch&&!RANK_REDUCED;
  const game=games[nextIndex];

  try{
    // データ取得は演出と並行して走らせる
    const dataP=fetchRanking(game).then(rows=>({rows}),err=>({err}));
    let res;

    if(isSwitch){
      panel.classList.remove("rank-in","rank-cinema");
      panel.classList.add("rank-out");
      if(fancy)startCover(game,dir);
      // カードを読ませる最低時間 と データ到着 の両方を待つ(API が遅くても閉じたまま待つ。上限4秒)
      const hold=sleep(fancy?900:RANK_REDUCED?0:200);
      const timeout=sleep(4000).then(()=>({err:new Error("timeout")}));
      [res]=await Promise.all([Promise.race([dataP,timeout]),hold]);
    }else{
      res=await dataP;
    }

    index=nextIndex;
    panel.classList.remove("rank-out","rank-in");
    panel.style.setProperty("--rv",(fancy?300:0)+"ms");  // シャッターが開くのを待って登場

    titleEl.textContent=game.title+(modeName(game.mode)?" · "+modeName(game.mode):"");
    linkEl.href="/games/play/?id="+encodeURIComponent(game.id);
    linkEl.innerHTML=ICON_PLAY+"このゲームを遊ぶ";
    renderDots();

    let hasRows=false;
    if(res.err){
      showMessage("ランキングを取得できませんでした。");
      console.debug("KURO ranking carousel:",res.err);
    }else if(!res.rows.length){
      showMessage("このモードのランキングデータはまだありません。");
    }else{
      listEl.innerHTML=renderRows(res.rows.slice(0,3));
      hasRows=true;
    }

    panel.dataset.rankReady="1";
    void panel.offsetWidth;
    panel.classList.add("rank-in");

    if(hasRows){
      runCounts();
      playCinema();
    }
    if(fancy){
      revealCover();
      // シャッターが閉じきった瞬間の衝撃
      panel.classList.remove("rank-shake");
      void panel.offsetWidth;
      panel.classList.add("rank-shake");
      setTimeout(()=>panel.classList.remove("rank-shake"),440);
    }
  }finally{
    busy=false;
    rankDir=1;
    schedule(rankNextDelay);
    rankNextDelay=5000;
  }
}

 // Dot navigation (dots remain keyboard and pointer accessible).
 dotsEl.addEventListener("click",event=>{
  const dot=event.target.closest("button.rank-dot");
  if(!dot)return;
  const target=Number(dot.dataset.rankIndex);
  if(!Number.isInteger(target)||target<0||target>=games.length||target===index)return;
  rankNextDelay=12000;
  rankDir=target<index?-1:1;
  display(target);
 });
 panel.addEventListener("pointerenter",()=>{
  rankHoverPaused=true;
  clearTimeout(rankTimer);
 });
 panel.addEventListener("pointerleave",()=>{
  rankHoverPaused=false;
  if(!busy&&!rankCovering)schedule(5000);
 });

 async function loadRankings(){
  if(!kuroGamesDB)throw new Error("ランキング通信を準備できませんでした");
  const {data:published,error:gamesError}=await kuroGamesDB.from("game_studio_games")
   .select("id,title,status").eq("status","published")
   .order("published_at",{ascending:false}).limit(60);
  if(gamesError)throw gamesError;

  const candidates=(published||[]).filter(game=>game.id&&game.title);
  const configs=await Promise.all(candidates.map(async game=>{
   try{
    const {data,error}=await kuroGamesDB.functions.invoke("kurogames-online",{
     body:{action:"get_config",gameId:game.id}
    });
    if(error)throw error;
    return data?.features?.ranking===true&&data?.features?.rankingShowcase===true?game:null;
   }catch(err){
    console.debug("Ranking config skipped:",game.id,err);
    return null;
   }
  }));
  const enabled=configs.filter(Boolean);
  const expanded=await Promise.all(enabled.map(async game=>{
   try{
    const {data,error}=await kuroGamesDB.functions.invoke("kurogames-online",{
     body:{action:"leaderboard_modes",gameId:game.id}
    });
    if(error)throw error;
    const modes=Array.isArray(data?.modes)&&data.modes.length?data.modes:["default"];
    return modes.map(mode=>({id:game.id,title:game.title,mode}));
   }catch(err){
    console.debug("Ranking modes skipped:",game.id,err);
    return [{id:game.id,title:game.title,mode:"default"}];
   }
  }));
  return expanded.flat();
 }

 async function initialize(){
  if(!kuroGamesDB){
   showMessage("ランキング通信を準備できませんでした。");
   return;
  }
  try{
   games=await loadRankings();
   if(!games.length){
    showMessage("スタジオの「オンライン機能」から、ランキング欄に表示するゲームを選択してください。");
    return;
   }
   await display(0);

   // Refresh publication and Studio showcase settings without changing the current game.
   setInterval(async()=>{
    if(busy)return;
    try{
     const current=games[index];
     const fresh=await loadRankings();
     if(!fresh.length){
      games=[];
      cache.clear();
      showMessage("スタジオの「オンライン機能」から、ランキング欄に表示するゲームを選択してください。");
      clearTimeout(rankTimer);
      return;
     }
     games=fresh;
     cache.clear();
     const found=current?games.findIndex(game=>game.id===current.id&&game.mode===current.mode):-1;
     index=found>=0?found:Math.min(index,games.length-1);
     renderDots();
     if(!rankHoverPaused)await display(index);
    }catch(err){
     console.debug("KURO ranking refresh skipped:",err);
    }
   },60000);
  }catch(error){
   showMessage("ランキングを読み込めませんでした。");
   console.warn("KURO ranking showcase init:",error);
  }
 }
 initialize();
}
initKuroRankingShowcase();
</script>
