<script>
(function(){
"use strict";
const SUPABASE_URL="https://cprvpphlfpmiegjiutjn.supabase.co";
const PUBLISHABLE_KEY="sb_publishable_BYPUfB0lrh26jV8_6ZQnpQ_wfAKOVyn";
const PROXY_URL="https://kurolab.cc.cd/api/cloudflare-relay";
async function cloudflareFetch(input,init){
 const req=new Request(input,init),url=new URL(req.url);
 if(url.origin!==SUPABASE_URL)return fetch(req);
 const bytes=new Uint8Array(await req.arrayBuffer());let binary="";
 for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode.apply(null,bytes.subarray(i,Math.min(i+0x8000,bytes.length)));
 const headers={};req.headers.forEach((v,k)=>{headers[k]=v;});
 const proxy=await fetch(PROXY_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path:url.pathname+url.search,method:req.method,headers,bodyBase64:bytes.length?btoa(binary):"",clientId:"game-studio"})});
 let result;try{result=await proxy.json();}catch(e){throw new Error("Cloudflare中継サーバーの応答を読み取れませんでした");}
 if(!proxy.ok||!result||typeof result.status!=="number")throw new Error(result&&result.error||"Cloudflare中継通信に失敗しました");
 let body=null;
 if(result.isBinary&&result.bodyBase64){const raw=atob(result.bodyBase64),out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);body=out;}
 else if(result.bodyText!==undefined&&![204,205,304].includes(result.status))body=result.bodyText;
 return new Response(body,{status:result.status,headers:result.headers||{"Content-Type":"application/json"}});
}
const db=window.supabase&&window.supabase.createClient?window.supabase.createClient(SUPABASE_URL,PUBLISHABLE_KEY,{global:{fetch:cloudflareFetch},auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}}):null;
const $=s=>document.querySelector(s),list=$("#notificationList"),status=$("#status"),unreadCount=$("#unreadCount"),markAll=$("#markAll");
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const typeText={follow:"フォローされました",follow_back:"フォローバックされました",like:"投稿にいいねされました",reply:"投稿に返信がありました",message:"メッセージが届きました",mention:"グループチャットでメンションされました"};
let user=null,items=[],filter="all",prefs={},refreshing=false;

function serviceLabel(scope){
 return ({all:"全サービス",both:"KURO Lab・SNS",lab:"KURO Lab",sns:"KURO SNS",games:"KURO GAMES"})[scope]||"運営";
}
function destination(item){
 if(item.kind==="social")return item.type==="message"||item.type==="mention"?"/chat/":"/sns/";
 if(item.kind==="reply")return "/request/";
 if(item.kind==="points")return "/games/store/";
 return item.href||"";
}
function iconFor(item){
 return ({admin:"📢",social:item.type==="message"||item.type==="mention"?"💬":"👤",reply:"✉️",points:"🪙",announcement:"🔔"})[item.kind]||"🔔";
}
function visibleItems(){
 return filter==="all"?items:items.filter(x=>x.kind===filter||(filter==="announcement"&&x.kind==="admin"&&x.portal_announcement_id));
}
function fmt(date){
 try{return new Date(date).toLocaleString("ja-JP",{year:"numeric",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});}catch(e){return "";}
}
function render(){
 const shown=visibleItems(),unread=items.filter(x=>!x.read).length;
 unreadCount.textContent="未読 "+unread+" 件";
 markAll.disabled=!unread||!user;
 status.textContent=user?items.length+" 件の通知":"ログインすると通知が表示されます";
 if(!user){list.innerHTML='<div class="state"><strong>ログインが必要です</strong>KURO GAMESでログインすると、全サービス共通の通知を確認できます。<br><a class="action primary" href="/games/">ゲーム一覧へ戻る</a></div>';return;}
 if(!shown.length){list.innerHTML='<div class="state"><strong>'+(filter==="all"?"通知はまだありません":"この種類の通知はありません")+'</strong>新しい通知が届くと、ここに表示されます。</div>';return;}
 list.innerHTML=shown.map(item=>{
  const unread=!item.read;
  const source=item.kind==="points"?"ポイント獲得":item.kind==="admin"?"運営のお知らせ":item.kind==="social"?"KURO SNS・チャット":item.kind==="reply"?"リクエストBOXへの返信":"サービスのお知らせ";
  const sourceClass=item.kind==="points"?"points":item.kind==="admin"||item.kind==="announcement"?"admin":item.kind==="social"?"sns":"reply";
  const action=destination(item);
  return '<article class="item '+(unread?"unread":"")+'"><div class="icon">'+iconFor(item)+'</div><div class="item-main"><div class="meta"><span class="source '+sourceClass+'">'+source+'</span><span>'+esc(item.serviceLabel||"")+'</span><time>'+esc(fmt(item.created_at))+'</time></div><h2>'+esc(item.title)+(unread?'<i class="unread-dot" aria-label="未読"></i>':"")+'</h2><p>'+esc(item.body||"")+'</p><div class="actions">'+(action?'<button class="action primary" type="button" data-open="'+esc(item.key)+'">開く</button>':'<button class="action" type="button" data-read="'+esc(item.key)+'">'+(unread?"既読にする":"確認済み")+'</button>')+(unread&&action?'<button class="action" type="button" data-read="'+esc(item.key)+'">既読にする</button>':"")+'</div></div></article>';
 }).join("");
}
async function load(){
 if(!db){list.innerHTML='<div class="error">認証システムを読み込めませんでした。ページを再読み込みしてください。</div>';status.textContent="接続エラー";return;}
 if(refreshing)return;refreshing=true;status.textContent="通知を更新中…";
 try{
  const auth=await db.auth.getUser();if(auth?.error)throw auth.error;if(!auth?.data)throw new Error("認証情報の応答がありません。");user=auth.data.user&&!auth.data.user.is_anonymous?auth.data.user:null;
  if(!user){items=[];render();return;}
  const [messagesResult,socialResult,repliesResult,annResult,prefsResult]=await Promise.all([
   db.from("admin_messages").select("id,title,body,href,audience,recipient_id,created_at,service_scope,portal_announcement_id").eq("published",true).or("audience.eq.all,recipient_id.eq."+user.id).order("created_at",{ascending:false}).limit(200),
   db.from("notifications").select("id,type,actor_id,created_at,read_at,group_id,message_id,notification_details").eq("recipient_id",user.id).order("created_at",{ascending:false}).limit(100),
   db.from("portal_request_notifications").select("id,request_id,created_at,read_at,request:portal_requests(message,admin_reply,replied_at)").eq("user_id",user.id).order("created_at",{ascending:false}).limit(50),
   db.from("portal_announcements").select("id,title,body,href,created_at").eq("published",true).order("created_at",{ascending:false}).limit(100),
   db.from("portal_preferences").select("preferences").eq("user_id",user.id).maybeSingle()
  ]);
  for(const r of [messagesResult,socialResult,repliesResult,annResult,prefsResult]){if(r?.error)throw r.error;if(!r)throw new Error("通知データの応答がありません。");}
  prefs=prefsResult.data&&prefsResult.data.preferences&&typeof prefsResult.data.preferences==="object"?prefsResult.data.preferences:{};
  const messages=messagesResult.data||[],messageIds=messages.map(x=>x.id),readsResult=messageIds.length?await db.from("admin_message_reads").select("message_id,read_at").eq("user_id",user.id).in("message_id",messageIds):{data:[],error:null};
  if(readsResult?.error)throw readsResult.error;
  const readMessageIds=new Set((readsResult.data||[]).map(x=>x.message_id));
  const social=socialResult.data||[],actorIds=Array.from(new Set(social.map(x=>x.actor_id).filter(Boolean)));
  const actorResult=actorIds.length?await db.from("profiles").select("id,username,display_name").in("id",actorIds):{data:[],error:null};
  if(actorResult?.error)throw actorResult.error;
  const actors=new Map((actorResult.data||[]).map(x=>[x.id,x]));
  const mirrored=new Set(messages.map(x=>x.portal_announcement_id).filter(Boolean));
  const next=[];
  social.filter(x=>x.type==="coin_reward").forEach(x=>{const d=x.notification_details||{},amount=Number(d.amount||0),title=d.adminAdjustment?"管理者によるポイント補正 "+(amount>0?"+":"")+amount+" P":"ポイントを獲得しました！ +"+amount+" P";next.push({key:"points:"+x.id,kind:"points",id:x.id,type:x.type,title,body:(d.description||"報酬を獲得しました。")+(d.balanceAfter!=null?"\n補正後の残高: "+d.balanceAfter+" P":""),created_at:x.created_at,read:!!x.read_at,serviceLabel:"KURO GAMES",href:"/games/store/"});});
  messages.forEach(x=>next.push({key:"admin:"+x.id,kind:"admin",id:x.id,title:x.title,body:x.body,href:x.href,created_at:x.created_at,read:readMessageIds.has(x.id),serviceLabel:serviceLabel(x.service_scope),portal_announcement_id:x.portal_announcement_id}));
  social.filter(x=>x.type!=="coin_reward").forEach(x=>{
   const actor=actors.get(x.actor_id)||{},name=actor.display_name||actor.username||"ユーザー";
   next.push({key:"social:"+x.id,kind:"social",id:x.id,type:x.type,title:name+" さんからの通知",body:typeText[x.type]||"新しい通知があります。",created_at:x.created_at,read:!!x.read_at,serviceLabel:"KURO SNS"});
  });
  (repliesResult.data||[]).forEach(x=>{
   const req=x.request||{};
   next.push({key:"reply:"+x.id,kind:"reply",id:x.id,title:"リクエストBOXに返信が届きました",body:req.admin_reply||"運営から返信がありました。",created_at:x.created_at,read:!!x.read_at,serviceLabel:"KURO Lab",extra:req.message||""});
  });
  const readAnnouncements=new Set(Array.isArray(prefs.readAnnouncements)?prefs.readAnnouncements:[]);
  (annResult.data||[]).filter(x=>!mirrored.has(x.id)).forEach(x=>{
   next.push({key:"announcement:"+x.id,kind:"announcement",id:x.id,title:x.title,body:x.body,href:x.href,created_at:x.created_at,read:readAnnouncements.has(x.id),serviceLabel:"KURO Lab"});
  });
  items=next.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  render();
 }catch(error){
  console.error("[KURO GAMES notifications]",error);
  list.innerHTML='<div class="error">通知を読み込めませんでした。通信状態を確認して、更新してください。<br>'+esc(error.message||"不明なエラー")+'</div>';
  status.textContent="読み込みエラー";
 }finally{refreshing=false;}
}
async function markRead(item){
 if(!user||!item||item.read)return;
 const now=new Date().toISOString();
 let result={error:null};
 if(item.kind==="admin"){
  result=await db.from("admin_message_reads").upsert({message_id:item.id,user_id:user.id,read_at:now},{onConflict:"message_id,user_id"});
 }else if(item.kind==="social"||item.kind==="points"){
  result=await db.from("notifications").update({read_at:now}).eq("id",item.id).eq("recipient_id",user.id);
 }else if(item.kind==="reply"){
  result=await db.from("portal_request_notifications").update({read_at:now}).eq("id",item.id).eq("user_id",user.id);
 }else if(item.kind==="announcement"){
  const list=Array.isArray(prefs.readAnnouncements)?prefs.readAnnouncements.slice():[];
  if(!list.includes(item.id))list.push(item.id);
  prefs=Object.assign({},prefs,{readAnnouncements:list.slice(-300)});
  result=await db.from("portal_preferences").upsert({user_id:user.id,preferences:prefs,updated_at:now},{onConflict:"user_id"});
 }
 if(result.error)throw result.error;
 item.read=true;render();
}
async function markAllNotificationsRead(){
 if(!user)return;markAll.disabled=true;
 try{
  const now=new Date().toISOString();
  const admin=items.filter(x=>x.kind==="admin"&&!x.read),social=items.filter(x=>(x.kind==="social"||x.kind==="points")&&!x.read),replies=items.filter(x=>x.kind==="reply"&&!x.read),anns=items.filter(x=>x.kind==="announcement"&&!x.read);
  const operations=[];
  if(admin.length)operations.push(db.from("admin_message_reads").upsert(admin.map(x=>({message_id:x.id,user_id:user.id,read_at:now})),{onConflict:"message_id,user_id"}));
  if(social.length)operations.push(db.from("notifications").update({read_at:now}).eq("recipient_id",user.id).in("id",social.map(x=>x.id)));
  if(replies.length)operations.push(db.from("portal_request_notifications").update({read_at:now}).eq("user_id",user.id).in("id",replies.map(x=>x.id)));
  if(anns.length){
   const ids=Array.isArray(prefs.readAnnouncements)?prefs.readAnnouncements.slice():[];
   anns.forEach(x=>{if(!ids.includes(x.id))ids.push(x.id);});
   prefs=Object.assign({},prefs,{readAnnouncements:ids.slice(-300)});
   operations.push(db.from("portal_preferences").upsert({user_id:user.id,preferences:prefs,updated_at:now},{onConflict:"user_id"}));
  }
  const results=await Promise.all(operations);for(const r of results)if(r.error)throw r.error;
  items.forEach(x=>x.read=true);render();
 }catch(error){console.error(error);alert("通知をすべて既読にできませんでした："+(error.message||"不明なエラー"));markAll.disabled=false;}
}
function openItem(key){
 const item=items.find(x=>x.key===key);if(!item)return;
 const go=destination(item);
 Promise.resolve(markRead(item)).catch(error=>console.warn("Notification read state could not be updated:",error)).finally(()=>{
  if(go){if(/^https:\/\//i.test(go))window.location.assign(go);else if(go.startsWith("/")&&!go.startsWith("//"))window.location.assign(go);}
 });
}
$("#filters").addEventListener("click",event=>{
 const button=event.target.closest("[data-filter]");if(!button)return;
 filter=button.dataset.filter;
 document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===button));
 render();
});
list.addEventListener("click",event=>{
 const open=event.target.closest("[data-open]"),read=event.target.closest("[data-read]");
 if(open)openItem(open.dataset.open);
 if(read){const item=items.find(x=>x.key===read.dataset.read);markRead(item).catch(error=>alert("既読にできませんでした："+error.message));}
});
markAll.addEventListener("click",markAllNotificationsRead);
if(db){
