<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>KURO GAME STUDIO</title>
<style>
:root{color-scheme:dark;--bg:#090b12;--p:#111522;--p2:#191f30;--line:#293247;--text:#f4f6fc;--muted:#929db2;--accent:#8d78ff;--good:#52c99a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{height:60px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#0d111b;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.brand{font-weight:900;font-size:17px}.brand b{color:var(--accent)}.spacer{flex:1}.muted{color:var(--muted);font-size:11px}.btn{border:1px solid var(--line);background:#ffffff08;color:var(--text);border-radius:8px;padding:8px 11px;font-size:11px;font-weight:750}.btn.primary{background:linear-gradient(110deg,#9277ff,#657dff);border-color:transparent}.shell{height:calc(100vh - 60px);min-height:590px;display:grid;grid-template-rows:1fr 38px}.work{min-height:0;display:grid;grid-template-columns:205px minmax(320px,1fr) 250px}.panel{background:var(--p);overflow:auto;min-height:0}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.ph{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--line);font-size:12px;font-weight:850}.pb{padding:12px}.label{font-size:10px;color:var(--muted);font-weight:900;letter-spacing:.1em;margin:7px 0 9px}.palette{display:grid;grid-template-columns:1fr 1fr;gap:7px}.palette button{padding:10px 6px;text-align:left;background:var(--p2);border:1px solid var(--line);border-radius:8px;color:#dce2f0;font-size:11px}.palette span{display:block;font-size:19px;margin-bottom:5px}.layers{display:grid;gap:4px}.layer{width:100%;padding:8px;text-align:left;border:1px solid transparent;border-radius:7px;background:transparent;color:#cbd3e2;font-size:11px}.layer.active{background:#292343;border-color:#51478a;color:white}.center{display:grid;grid-template-rows:46px 1fr 36px;min-width:0;background:#0c1019}.toolbar{display:flex;align-items:center;gap:7px;padding:0 10px;border-bottom:1px solid var(--line)}.stagewrap{min-height:0;display:grid;place-items:center;overflow:auto;padding:18px;background-image:radial-gradient(#273149 1px,transparent 1px);background-size:18px 18px}.stage{position:relative;width:min(100%,960px);aspect-ratio:16/9;background:#17243a;border:1px solid #ffffff30;border-radius:8px;overflow:hidden;box-shadow:0 18px 50px #0008;touch-action:none}.obj{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-wrap;word-break:break-word;line-height:1.2;user-select:none;cursor:move;border:1px solid transparent}.obj.sel{outline:2px solid var(--accent);outline-offset:2px}.stage.playing .obj{cursor:pointer}.foot{display:flex;align-items:center;gap:8px;padding:0 12px;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}.field{display:grid;gap:5px;margin-bottom:11px}.field label{font-size:10px;color:#b9c3d5;font-weight:750}.field input,.field select,.field textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:7px;background:#0b101a;color:white;padding:8px;font-size:11px}.field input[type=color]{height:34px;padding:3px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:11px;line-height:1.8}.hint{font-size:10px;color:var(--muted);line-height:1.6}.bottom{display:flex;align-items:center;gap:16px;padding:0 14px;border-top:1px solid var(--line);background:#101521;color:var(--muted);font-size:10px}.modalbg{display:none;position:fixed;inset:0;z-index:20;background:#000b;place-items:center;padding:18px}.modalbg.open{display:grid}.modal{width:min(620px,100%);padding:20px;background:#121827;border:1px solid var(--line);border-radius:14px}.modal h2{margin:0 0 5px;font-size:18px}.modal p{color:var(--muted);font-size:11px;margin:0 0 16px}.templates{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.tpl{padding:13px;text-align:left;border:1px solid var(--line);background:var(--p2);border-radius:9px;color:white}.tpl:hover{border-color:var(--accent)}.tpl span{display:block;font-size:25px;margin-bottom:9px}.tpl b{font-size:12px}.tpl small{display:block;color:var(--muted);font-size:10px;margin-top:5px;line-height:1.5}.toast{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);background:#202b40;border:1px solid #485675;padding:9px 14px;border-radius:8px;font-size:11px;opacity:0;transition:.2s;z-index:30}.toast.show{opacity:1}
@media(max-width:850px){.work{grid-template-columns:175px minmax(300px,1fr)}.right{display:none}}@media(max-width:600px){.top{padding:0 8px;gap:6px}.top .muted{display:none}.top .btn{padding:7px;font-size:10px}.shell{height:auto;min-height:calc(100vh - 60px)}.work{grid-template-columns:1fr;grid-template-rows:auto minmax(430px,1fr)}.left{border:0;border-bottom:1px solid var(--line);max-height:170px}.left .pb{display:grid;grid-template-columns:140px 1fr;gap:9px}.palette{grid-template-columns:1fr 1fr}.palette button{padding:6px}.palette span{display:inline;margin-right:4px;font-size:14px}.layers{max-height:115px;overflow:auto}.center{grid-row:2}.stagewrap{padding:8px}.toolbar{padding:0 6px;gap:4px}.toolbar .btn{padding:6px;font-size:9px}.templates{grid-template-columns:1fr}}
</style></head><body>
<header class="top"><a class="brand" href="/games/">KURO <b>GAME STUDIO</b></a><span class="muted">/ ビジュアルエディター</span><span class="spacer"></span><span class="muted" id="saveState">● 保存済み</span><button class="btn" id="newBtn">新規</button><button class="btn" id="saveBtn">保存</button><button class="btn" id="exportBtn">書き出し</button><button class="btn primary" id="playBtn">▶ テスト</button></header>
<div class="shell"><div class="work">
<aside class="panel left"><div class="ph">素材・オブジェクト <button class="btn" id="tplBtn">テンプレート</button></div><div class="pb"><div><div class="label">追加する</div><div class="palette"><button data-add="text"><span>Ｔ</span>テキスト</button><button data-add="button"><span>▣</span>ボタン</button><button data-add="shape"><span>■</span>図形</button><button data-add="emoji"><span>🎮</span>アイコン</button></div></div><div><div class="label">シーン内の要素</div><div class="layers" id="layers"></div></div></div></aside>
<main class="center"><div class="toolbar"><button class="btn" id="undo">↶</button><button class="btn" id="redo">↷</button><button class="btn" id="grid">▦ グリッド</button><button class="btn" id="delete">削除</button><span class="spacer"></span><span class="muted" id="projectName">新しいゲーム</span></div><div class="stagewrap"><div class="stage" id="stage"></div></div><div class="foot"><span>960 × 540</span><span>・</span><span id="selectedLabel">未選択</span><span class="spacer"></span><span id="typeLabel">クリックゲーム</span></div></main>
<aside class="panel right"><div class="ph">プロパティ</div><div class="pb" id="inspector"><div class="empty">オブジェクトを選択すると、ここで編集できます。</div></div></aside>
</div><footer class="bottom"><span>シーン 1</span><span>イベント（準備中）</span><span>素材ライブラリ（準備中）</span><span class="spacer"></span><span>KURO GAME STUDIO · BETA</span></footer></div>
<div class="modalbg" id="modal"><section class="modal"><h2>テンプレートを選択</h2><p>ベースのゲームを選び、画面の要素やルールを編集できます。</p><div class="templates"><button class="tpl" data-type="clicker"><span>👆</span><b>クリックゲーム</b><small>ボタンを押してスコアを増やす</small></button><button class="tpl" data-type="quiz"><span>💡</span><b>クイズゲーム</b><small>問題と選択肢を編集して遊ぶ</small></button><button class="tpl" data-type="target"><span>🎯</span><b>ターゲットゲーム</b><small>ターゲットをクリックして得点</small></button></div><div style="text-align:right;margin-top:16px"><button class="btn" id="closeModal">閉じる</button></div></section></div><div class="toast" id="toast"></div>
<script>
(function(){
const $=id=>document.getElementById(id),KEY="kuroGameStudio.v1",clone=x=>JSON.parse(JSON.stringify(x)),uid=()=>Math.random().toString(36).slice(2,9);
const templates={
clicker:{type:"clicker",background:"#17243a",objects:[{id:"title",type:"text",name:"タイトル",text:"CLICK GAME",x:25,y:10,w:50,h:15,color:"#fff",bg:"transparent",size:34,radius:0},{id:"score",type:"text",name:"スコア",text:"SCORE  0",x:35,y:32,w:30,h:12,color:"#d8def0",bg:"transparent",size:22,radius:0},{id:"main",type:"button",name:"スコアボタン",text:"クリック！",x:34,y:53,w:32,h:17,color:"#fff",bg:"#8068ed",size:22,radius:14}]},
quiz:{type:"quiz",background:"#17243a",objects:[{id:"title",type:"text",name:"タイトル",text:"QUIZ CHALLENGE",x:20,y:8,w:60,h:14,color:"#fff",bg:"transparent",size:30,radius:0},{id:"question",type:"text",name:"問題文",text:"日本で一番高い山は？",x:12,y:29,w:76,h:19,color:"#fff",bg:"#263955",size:21,radius:12},{id:"a",type:"button",name:"選択肢 A",text:"A. 富士山",x:18,y:55,w:28,h:14,color:"#fff",bg:"#5274c9",size:16,radius:9},{id:"b",type:"button",name:"選択肢 B",text:"B. 北岳",x:54,y:55,w:28,h:14,color:"#fff",bg:"#5274c9",size:16,radius:9}]},
target:{type:"target",background:"#101b2d",objects:[{id:"title",type:"text",name:"タイトル",text:"TARGET HUNT",x:20,y:7,w:60,h:14,color:"#fff",bg:"transparent",size:30,radius:0},{id:"score",type:"text",name:"スコア",text:"SCORE  0",x:35,y:26,w:30,h:11,color:"#cbd7ec",bg:"transparent",size:18,radius:0},{id:"target",type:"emoji",name:"ターゲット",text:"🎯",x:42,y:47,w:16,h:26,color:"#fff",bg:"transparent",size:66,radius:0}]}
};
let p,selected=null,playing=false,undoStack=[],redoStack=[],drag=null;
function fresh(type){let t=clone(templates[type]);return{id:uid(),name:"新しいゲーム",type:t.type,background:t.background,objects:t.objects};}
function toast(s){$("toast").textContent=s;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1800)}
function dirty(){$("saveState").textContent="● 未保存";$("saveState").style.color="#efbd69"}
function snapshot(){undoStack.push(clone(p));if(undoStack.length>50)undoStack.shift();redoStack=[]}
function save(){try{let all=JSON.parse(localStorage.getItem(KEY)||"[]"),i=all.findIndex(x=>x.id===p.id);if(i<0)all.unshift(p);else all[i]=p;localStorage.setItem(KEY,JSON.stringify(all));localStorage.setItem(KEY+".current",p.id);$("saveState").textContent="● 保存済み";$("saveState").style.color="var(--good)";toast("このブラウザに保存しました")}catch(e){toast("保存できませんでした")}}
function setProject(x){p=clone(x);selected=p.objects[0]?.id||null;playing=false;undoStack=[];redoStack=[];render()}
function obj(){return p.objects.find(x=>x.id===selected)}
function add(type){snapshot();let n=p.objects.length+1,o={id:uid(),type:type,name:({text:"テキスト",button:"ボタン",shape:"図形",emoji:"アイコン"}[type])+" "+n,text:({text:"テキストを入力",button:"ボタン",shape:"",emoji:"⭐"}[type]),x:35,y:38,w:24,h:15,color:"#ffffff",bg:type==="shape"?"#8d78ff":type==="button"?"#8068ed":"transparent",size:20,radius:10};p.objects.push(o);selected=o.id;dirty();render()}
function render(){ $("projectName").textContent=p.name;$("typeLabel").textContent=({clicker:"クリックゲーム",quiz:"クイズゲーム",target:"ターゲットゲーム"}[p.type]);$("stage").style.background=p.background;$("stage").classList.toggle("playing",playing);renderStage();renderLayers();renderInspector();$("playBtn").textContent=playing?"■ 編集に戻る":"▶ テスト"}
function renderStage(){let s=$("stage");s.querySelectorAll(".obj").forEach(n=>n.remove());p.objects.forEach(o=>{let e=document.createElement("div");e.className="obj"+(selected===o.id&&!playing?" sel":"");e.dataset.id=o.id;e.textContent=o.text;e.style.cssText="left:"+o.x+"%;top:"+o.y+"%;width:"+o.w+"%;height:"+o.h+"%;color:"+o.color+";background:"+o.bg+";font-size:"+Math.max(10,o.size/540*100)+"cqh;border-radius:"+o.radius+"px";if(o.type==="shape")e.style.border="0";if(o.type==="emoji")e.style.fontSize=Math.max(18,o.size)+"px";if(playing)e.onclick=()=>gameClick(o);else{e.onpointerdown=ev=>startDrag(ev,o.id);e.onclick=ev=>{ev.stopPropagation();selected=o.id;render()}}s.appendChild(e)})}
function renderLayers(){let box=$("layers");box.innerHTML="";p.objects.forEach(o=>{let b=document.createElement("button");b.className="layer"+(o.id===selected?" active":"");b.textContent=({text:"T",button:"▣",shape:"■",emoji:"✦"}[o.type])+"　"+o.name;b.onclick=()=>{selected=o.id;render()};box.appendChild(b)})}
function addField(box,label,key,value,type,opts){let w=document.createElement("div");w.className="field";let l=document.createElement("label");l.textContent=label;let i=document.createElement(type==="select"?"select":"input");if(type!=="select")i.type=type;if(opts&&opts.choices)opts.choices.forEach(x=>{let o=document.createElement("option");o.value=x[0];o.textContent=x[1];i.appendChild(o)});i.value=value??"";if(opts){if(opts.min!=null)i.min=opts.min;if(opts.max!=null)i.max=opts.max}i.onchange=()=>{snapshot();let o=obj();if(!o)return;o[key]=type==="number"?Number(i.value):i.value;dirty();renderStage();renderLayers()};w.append(l,i);box.appendChild(w)}
function renderInspector(){let box=$("inspector");box.innerHTML="";let o=obj();if(!o){box.innerHTML='<div class="empty">オブジェクトを選択すると、ここで編集できます。</div>';return}let lab=document.createElement("div");lab.className="label";lab.textContent="選択中のオブジェクト";box.appendChild(lab);addField(box,"名前","name",o.name,"text");addField(box,"表示テキスト","text",o.text,"text");let r=document.createElement("div");r.className="row";box.appendChild(r);addField(r,"X (%)","x",o.x,"number",{min:0,max:100});addField(r,"Y (%)","y",o.y,"number",{min:0,max:100});r=document.createElement("div");r.className="row";box.appendChild(r);addField(r,"幅 (%)","w",o.w,"number",{min:1,max:100});addField(r,"高さ (%)","h",o.h,"number",{min:1,max:100});r=document.createElement("div");r.className="row";box.appendChild(r);addField(r,"文字色","color",o.color,"color");addField(r,"背景色","bg",o.bg==="transparent"?"#000000":o.bg,"color");r=document.createElement("div");r.className="row";box.appendChild(r);addField(r,"文字サイズ","size",o.size,"number",{min:8,max:100});addField(r,"角丸","radius",o.radius,"number",{min:0,max:50});let h=document.createElement("p");h.className="hint";h.textContent="位置とサイズは画面に対する割合です。画面比率を保って表示します。";box.appendChild(h);let d=document.createElement("button");d.className="btn";d.textContent="この要素を削除";d.onclick=deleteSelected;box.appendChild(d)}
function startDrag(e,id){if(playing)return;e.preventDefault();e.stopPropagation();selected=id;let o=obj(),r=$("stage").getBoundingClientRect();drag={id,sx:e.clientX,sy:e.clientY,x:o.x,y:o.y,w:r.width,h:r.height,moved:false};e.currentTarget.setPointerCapture(e.pointerId);renderLayers();renderInspector();let el=$("stage").querySelector('[data-id="'+id+'"]');el.onpointermove=moveDrag;el.onpointerup=endDrag}
function moveDrag(e){if(!drag)return;let o=obj();if(!o)return;let dx=(e.clientX-drag.sx)/drag.w*100,dy=(e.clientY-drag.sy)/drag.h*100;if(Math.abs(dx)+Math.abs(dy)>.2)drag.moved=true;o.x=Math.max(0,Math.min(100-o.w,drag.x+dx));o.y=Math.max(0,Math.min(100-o.h,drag.y+dy));let el=$("stage").querySelector('[data-id="'+o.id+'"]');el.style.left=o.x+"%";el.style.top=o.y+"%"}
function endDrag(){if(drag&&drag.moved){dirty();renderInspector()}drag=null}
function deleteSelected(){if(!selected)return;snapshot();p.objects=p.objects.filter(o=>o.id!==selected);selected=p.objects[0]?.id||null;dirty();render()}
function gameClick(o){if(p.type==="clicker"&&o.type==="button"){let s=p.objects.find(x=>x.id==="score");if(s)s.text="SCORE  "+((Number((s.text.match(/\d+/)||["0"])[0]))+1);renderStage()}else if(p.type==="quiz"&&o.type==="button"){toast(o.id==="a"?"正解！":"もう一度挑戦！")}else if(p.type==="target"&&o.id==="target"){let s=p.objects.find(x=>x.id==="score");if(s)s.text="SCORE  "+((Number((s.text.match(/\d+/)||["0"])[0]))+10);o.x=5+Math.random()*75;o.y=25+Math.random()*55;renderStage()}}
function download(name,text,mime){let u=URL.createObjectURL(new Blob([text],{type:mime})),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportGame(){
const data=JSON.stringify(p).replace(/</g,"\\u003c");
const html='<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+p.name+'</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;font-family:system-ui,sans-serif}.game{position:relative;width:min(960px,96vw);aspect-ratio:16/9;overflow:hidden;border-radius:14px;background:'+p.background+';box-shadow:0 20px 60px #0008}.o{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-wrap;word-break:break-word;line-height:1.2;cursor:pointer}</style><main class="game" id="game"></main><script>const P='+data+';const root=document.getElementById("game");P.objects.forEach(o=>{const e=document.createElement("div");e.className="o";e.textContent=o.text;e.dataset.id=o.id;e.style.cssText="left:"+o.x+"%;top:"+o.y+"%;width:"+o.w+"%;height:"+o.h+"%;color:"+o.color+";background:"+o.bg+";font-size:"+Math.max(10,o.size/540*100)+"cqh;border-radius:"+o.radius+"px";if(o.type==="emoji")e.style.fontSize=Math.max(18,o.size)+"px";e.onclick=()=>{if(P.type==="clicker"&&o.type==="button"){const s=root.querySelector("[data-id=score]");if(s)s.textContent="SCORE  "+((Number((s.textContent.match(/\\d+/)||["0"])[0]))+1)}else if(P.type==="quiz"&&o.type==="button"){alert(o.id==="a"?"正解！":"もう一度挑戦！")}else if(P.type==="target"&&o.id==="target"){const s=root.querySelector("[data-id=score]");if(s)s.textContent="SCORE  "+((Number((s.textContent.match(/\\d+/)||["0"])[0]))+10);e.style.left=(5+Math.random()*75)+"%";e.style.top=(25+Math.random()*55)+"%"}};root.appendChild(e)});<\\/script></main></html>';
download("kuro-game.html",html,"text/html");toast("プレイできるHTMLを書き出しました");
}
function openModal(){$("modal").classList.add("open")}
document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>add(b.dataset.add));document.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>{$("modal").classList.remove("open");setProject(fresh(b.dataset.type));dirty();toast("テンプレートを読み込みました")});
$("tplBtn").onclick=openModal;$("closeModal").onclick=()=>$("modal").classList.remove("open");$("newBtn").onclick=()=>{if(confirm("現在のゲームを保存して、新しいテンプレートを選びますか？")){save();openModal()}};$("saveBtn").onclick=save;$("exportBtn").onclick=exportGame;$("playBtn").onclick=()=>{playing=!playing;selected=null;render()};$("delete").onclick=deleteSelected;$("grid").onclick=()=>$("stage").style.backgroundImage=$("stage").style.backgroundImage?"":"linear-gradient(#ffffff12 1px,transparent 1px),linear-gradient(90deg,#ffffff12 1px,transparent 1px)";$("stage").onclick=e=>{if(e.target===$("stage")){selected=null;render()}};$("undo").onclick=()=>{if(undoStack.length){redoStack.push(clone(p));p=undoStack.pop();selected=null;dirty();render()}};$("redo").onclick=()=>{if(redoStack.length){undoStack.push(clone(p));p=redoStack.pop();selected=null;dirty();render()}};
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();save()}if(e.key==="Delete"&&!["INPUT","TEXTAREA"].includes(document.activeElement.tagName))deleteSelected()});
let init;try{let all=JSON.parse(localStorage.getItem(KEY)||"[]"),id=localStorage.getItem(KEY+".current");init=all.find(x=>x.id===id)||all[0]}catch(e){}setProject(init||fresh("clicker"));
})();
</script></body></html>
