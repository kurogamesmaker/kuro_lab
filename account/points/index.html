<script>
(function(){
"use strict";
const SUPABASE_URL="https://cprvpphlfpmiegjiutjn.supabase.co",KEY="sb_publishable_BYPUfB0lrh26jV_6ZQnpQ_wfAKOVyn";
const balance=document.getElementById("balance"),history=document.getElementById("history"),status=document.getElementById("status"),login=document.getElementById("login");
function clientId(){try{let v=sessionStorage.getItem("kuro_points_client_id");if(!v){v="points-"+(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));sessionStorage.setItem("kuro_points_client_id",v);}return v;}catch(_){return "points-history";}}
async function relay(input,init){const req=new Request(input,init),url=new URL(req.url);if(url.origin!==SUPABASE_URL)return fetch(req);const bytes=new Uint8Array(await req.arrayBuffer());let bin="";for(let i=0;i<bytes.length;i+=32768)bin+=String.fromCharCode.apply(null,bytes.subarray(i,Math.min(i+32768,bytes.length)));const headers={};req.headers.forEach((v,k)=>headers[k]=v);const proxy=await fetch("/api/cloudflare-relay",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path:url.pathname+url.search,method:req.method,headers,bodyBase64:bytes.length?btoa(bin):"",clientId:clientId()})});let result;try{result=await proxy.json();}catch(_){throw new Error("中継サーバーの応答を読み取れませんでした。");}if(!proxy.ok||!result||typeof result.status!=="number")throw new Error(result&&result.error||"中継通信に失敗しました。");let body=null;if(result.isBinary&&result.bodyBase64){const raw=atob(result.bodyBase64),out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);body=out;}else if(result.bodyText!==undefined&&![204,205,304].includes(result.status))body=result.bodyText;return new Response(body,{status:result.status,headers:result.headers||{"Content-Type":"application/json"}});}

async function load(){balance.textContent="読み込み中…";empty("履歴を読み込んでいます…");login.hidden=true;try{const auth=await db.auth.getSession();const user=auth.data?.session?.user;if(auth.error||!user||user.is_anonymous){balance.textContent="—";empty("ログインするとポイント履歴を確認できます。");login.hidden=false;setStatus("ログインしてください。");return;}const sessionResult=await db.auth.getSession();const session=sessionResult.data?.session;if(!session?.access_token)throw new Error("ログインセッションを取得できませんでした。再ログインしてください。");const result=await db.functions.invoke("kurogames-online",{body:{action:"coin_summary"},headers:{Authorization:"Bearer "+session.access_token}});if(result.error){let detail=result.error.message||"ポイント情報の取得に失敗しました。";let response=result.error.context;let responseStatus=response&&response.status;try{if(response&&typeof response.clone==="function"){const copy=response.clone();const payload=await copy.json();detail=payload?.error||payload?.message||detail;console.error("KURO points coin_summary Edge Function response",{status:responseStatus,payload});}else console.error("KURO points coin_summary Edge Function failed",result.error);}catch(parseError){try{const copy=response.clone();const text=await copy.text();console.error("KURO points coin_summary Edge Function response",{status:responseStatus,text});if(text)detail=text;}catch(_){console.error("KURO points coin_summary Edge Function failed",result.error);}}throw new Error((responseStatus?"HTTP "+responseStatus+" — ":"")+detail);}const data=result.data;if(!data||data.error)throw new Error(data&&data.error||"ポイント情報を取得できませんでした。");balance.textContent=Math.max(0,Number(data.balance)||0).toLocaleString("ja-JP")+" KC";const transactions=Array.isArray(data.transactions)?data.transactions:[];history.replaceChildren();if(!transactions.length){empty("まだポイントの獲得・使用履歴がありません。ゲームをプレイすると記録されます。");}else transactions.forEach(item=>{const row=document.createElement("div");row.className="row";const copy=document.createElement("div"),title=document.createElement("strong"),meta=document.createElement("small");title.textContent=String(item.description||"ポイント");const date=item.created_at?new Date(item.created_at):null;meta.textContent=(date&&!Number.isNaN(date.getTime())?new Intl.DateTimeFormat("ja-JP",{dateStyle:"medium",timeStyle:"short"}).format(date):"日時不明")+(item.source_mode?" · "+String(item.source_mode):"");copy.append(title,meta);const amount=document.createElement("span"),value=Number(item.amount)||0;amount.className="amount "+(value>=0?"positive":"negative");amount.textContent=(value>0?"+":"")+value.toLocaleString("ja-JP")+" KC";row.append(copy,amount);history.appendChild(row);});setStatus("ポイント残高と履歴を表示しています。");}catch(error){console.error("KURO points history load failed",error);balance.textContent="—";empty(error&&error.message||"ポイント履歴を読み込めませんでした。");setStatus("取得できませんでした。再読み込みしてください。");}}
