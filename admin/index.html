<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#101827">
<title>KURO Lab Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111c2d;--panel2:#172438;--line:#26364d;--text:#edf4ff;--muted:#8ea2bd;--blue:#48a9e8;--green:#46c69a;--amber:#e7b65c;--red:#ef7777}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% -10%,#183252 0,transparent 42%),var(--bg);color:var(--text);font:15px/1.6 Inter,"Noto Sans JP",system-ui,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.wrap{width:min(1180px,calc(100% - 36px));margin:auto}.top{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.02em}.mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#43b3ed,#3973d6);display:grid;place-items:center;font-weight:900;color:white}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.18em}.top-right{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 13px}.btn.primary{background:var(--blue);color:#061321;border-color:transparent;font-weight:750}.btn:disabled{opacity:.55;cursor:wait}.main{padding:34px 0 70px}.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.17em;text-transform:uppercase}.heading{display:flex;justify-content:space-between;align-items:end;gap:18px;margin:7px 0 24px}.heading h1{margin:0;font-size:clamp(25px,4vw,34px);letter-spacing:-.04em}.heading p{margin:5px 0 0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.stat,.panel{background:linear-gradient(145deg,rgba(23,36,56,.96),rgba(15,26,42,.96));border:1px solid var(--line);border-radius:16px}.stat{padding:17px 19px}.stat span{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:29px;margin-top:4px;font-variant-numeric:tabular-nums}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button{border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--muted);padding:7px 11px}.filters button.active{background:#1c3b59;border-color:#2e6c9c;color:#dff3ff}.search{background:#0b1524;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:9px 12px;min-width:min(260px,100%);outline:none}.list{display:grid;gap:10px;padding:14px}.item{background:rgba(7,15,27,.45);border:1px solid var(--line);border-radius:13px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px}.meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;color:var(--muted);font-size:12px}.pill{border-radius:999px;padding:3px 9px;font-size:11px;font-weight:750}.pending{background:#4b3a1c;color:#f3d28d}.reviewing{background:#173d5b;color:#9bd9ff}.done{background:#164638;color:#9ce5c8}.message{white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0 0;font-size:14px}.actions{display:flex;align-items:center;gap:8px}.actions select{background:#0b1524;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px}.empty,.error{padding:34px;text-align:center;color:var(--muted)}.error{color:#ffaaaa}.login{width:min(430px,calc(100% - 32px));margin:10vh auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 24px 80px #0005}.login h1{margin:5px 0 4px}.login p{color:var(--muted);margin:0 0 22px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:12px;color:var(--muted)}.field input{width:100%;background:#0b1524;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;outline:none}.login .btn{width:100%;margin-top:8px;padding:12px}.hint{font-size:12px;color:var(--muted);margin-top:14px}.statusline{font-size:12px;color:var(--muted)}.mode-select{background:#0b1524;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px 10px;max-width:230px}[hidden]{display:none!important}@media(max-width:680px){.wrap{width:min(100% - 24px,1180px)}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:24px}.heading{align-items:start;flex-direction:column}.item{grid-template-columns:1fr;gap:12px}.actions{justify-content:space-between}.top-right #account{display:none}.toolbar{align-items:stretch}.search{width:100%}}
</style>
</head>
<body>
<section id="loginView" class="login">
<div class="brand"><div class="mark">K</div><div>KURO Lab<small>ADMIN CONSOLE</small></div></div>
<div style="height:24px"></div><div class="eyebrow">Secure sign in</div><h1>管理者ログイン</h1><p>KURO Labの管理者アカウントでログインしてください。</p><div class="field"><label for="modeSelect">通信方式</label><select class="mode-select" id="modeSelect"><option value="supabase">Supabase版（直接通信）</option><option value="gas">GAS版（GAS経由）</option></select></div>
<form id="loginForm">
<div class="field"><label for="email">メールアドレス</label><input id="email" type="email" value="kurogamesmaker@gmail.com" autocomplete="username" required></div>
<div class="field"><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" required></div>
<button class="btn primary" id="loginButton">ログイン</button>
<div id="loginError" class="hint" role="alert"></div>
</form><div class="hint">この画面は管理者専用です。一般アカウントではアクセスできません。</div>
</section>
<div id="appView" hidden>
<header class="top"><div class="wrap" style="display:flex;align-items:center;justify-content:space-between"><div class="brand"><div class="mark">K</div><div>KURO Lab<small>ADMIN CONSOLE</small></div></div><div class="top-right"><span id="account"></span><select class="mode-select" id="modeSelectTop" aria-label="通信方式"><option value="supabase">Supabase版</option><option value="gas">GAS版</option></select><button class="btn" id="notifyButton">通知を許可</button><button class="btn" id="logoutButton">ログアウト</button></div></div></header>
<main class="wrap main">
<div class="eyebrow">Workspace / Requests</div>
<div class="heading"><div><h1>リクエストBOX</h1><p>利用者から届いたリクエストを確認・管理します。</p></div><div class="statusline" id="connection">接続中…</div></div>
<div class="stats"><div class="stat"><span>すべて</span><strong id="totalCount">—</strong></div><div class="stat"><span>未対応</span><strong id="pendingCount">—</strong></div><div class="stat"><span>確認中</span><strong id="reviewCount">—</strong></div></div>
<section class="panel"><div class="toolbar"><div class="filters" id="filters"><button class="active" data-filter="all">すべて</button><button data-filter="pending">未対応</button><button data-filter="reviewing">確認中</button><button data-filter="done">対応済み</button></div><input class="search" id="search" type="search" placeholder="内容を検索…"></div><div class="list" id="requestList"><div class="empty">読み込み中…</div></div></section>
</main></div>
<script>
(function(){
"use strict";
const SUPABASE_URL="https://cprvpphlfpmiegjiutjn.supabase.co";
const PUBLISHABLE_KEY="sb_publishable_BYPUfB0lrh26jV8_6ZQnpQ_wfAKOVyn";
const MODE_KEY="kuro-admin-connection-mode";
const mode=localStorage.getItem(MODE_KEY)==="gas"?"gas":"supabase";
async function gasFetch(input,init={}){
 const request=new Request(input,init);
 const target=new URL(request.url);
 if(target.origin!==SUPABASE_URL)return fetch(request);
 const bodyBuffer=["GET","HEAD"].includes(request.method)?new ArrayBuffer(0):await request.clone().arrayBuffer();
 const bytes=new Uint8Array(bodyBuffer);
 let binary="";
 for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));
 const bodyBase64=bytes.length?btoa(binary):"";
 const headers=Object.fromEntries(request.headers.entries());
 const proxyResponse=await fetch("/api/kuro-gas-proxy",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path:target.pathname+target.search,method:request.method,headers,bodyBase64,clientId:"admin-console"})});
 let result;
 try{result=await proxyResponse.json();}catch{throw new Error("GASプロキシからJSON以外の応答が返されました。");}
 if(!proxyResponse.ok||!result||typeof result.status!=="number"){
  throw new Error(result?.error||"GAS経由の通信に失敗しました。");
 }
 let responseBody=result.bodyText??"";
 if(result.isBinary&&result.bodyBase64){
  const raw=atob(result.bodyBase64),out=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);
  responseBody=out;
 }
 const status=result.status;
 return new Response([204,205,304].includes(status)?null:responseBody,{status,headers:result.headers||{}});
}
const db=window.supabase.createClient(SUPABASE_URL,PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true},global:{fetch:mode==="gas"?gasFetch:fetch}});
const modeSelect=$("#modeSelect"),modeSelectTop=$("#modeSelectTop");
function syncModeSelectors(){if(modeSelect)modeSelect.value=mode;if(modeSelectTop)modeSelectTop.value=mode;}
function setMode(next){if(next!=="gas"&&next!=="supabase")return;localStorage.setItem(MODE_KEY,next);location.reload();}
if(modeSelect)modeSelect.addEventListener("change",()=>setMode(modeSelect.value));
if(modeSelectTop)modeSelectTop.addEventListener("change",()=>setMode(modeSelectTop.value));
syncModeSelectors();
const $=s=>document.querySelector(s);
let rows=[],filter="all",channel=null,seen=new Set(),firstLoad=true;
const labels={pending:"未対応",reviewing:"確認中",done:"対応済み"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const date=s=>new Intl.DateTimeFormat("ja-JP",{dateStyle:"medium",timeStyle:"short"}).format(new Date(s));
function showLogin(message){$("#appView").hidden=true;$("#loginView").hidden=false;if(message)$("#loginError").textContent=message;}
function showApp(user){$("#loginView").hidden=true;$("#appView").hidden=false;$("#account").textContent=user.email||"管理者";$("#loginError").textContent="";}
async function checkAdmin(user){
 const {data,error}=await db.rpc("is_portal_admin");
 if(error)throw error;
 if(data!==true)throw new Error("このアカウントには管理者権限がありません。");
}
async function load(){
 $("#requestList").innerHTML='<div class="empty">読み込み中…</div>';
 const {data,error}=await db.from("portal_requests").select("id,message,status,created_at,user_id").order("created_at",{ascending:false}).limit(300);
 if(error){$("#requestList").innerHTML='<div class="error">読み込みに失敗しました：'+esc(error.message)+'</div>';return;}
 rows=data||[];
 if(!firstLoad){rows.forEach(r=>{if(!seen.has(r.id)){seen.add(r.id);}});}
 else {rows.forEach(r=>seen.add(r.id));firstLoad=false;}
 render();
}
function render(){
 const counts={pending:0,reviewing:0,done:0};rows.forEach(r=>counts[r.status]=(counts[r.status]||0)+1);
 $("#totalCount").textContent=rows.length;$("#pendingCount").textContent=counts.pending||0;$("#reviewCount").textContent=counts.reviewing||0;
 const q=$("#search").value.trim().toLowerCase();
 const shown=rows.filter(r=>(filter==="all"||r.status===filter)&&(!q||r.message.toLowerCase().includes(q)));
 if(!shown.length){$("#requestList").innerHTML='<div class="empty">該当するリクエストはありません。</div>';return;}
 $("#requestList").innerHTML=shown.map(r=>'<article class="item"><div><div class="meta"><span class="pill '+esc(r.status)+'">'+esc(labels[r.status]||r.status)+'</span><span>'+esc(date(r.created_at))+'</span><span>'+(r.user_id?'ログイン利用者':'ゲスト')+'</span></div><p class="message">'+esc(r.message)+'</p></div><div class="actions"><select aria-label="ステータス" data-status="'+esc(r.id)+'"><option value="pending" '+(r.status==="pending"?"selected":"")+'>未対応</option><option value="reviewing" '+(r.status==="reviewing"?"selected":"")+'>確認中</option><option value="done" '+(r.status==="done"?"selected":"")+'>対応済み</option></select><button class="btn primary" data-save="'+esc(r.id)+'">保存</button></div></article>').join("");
 $("#requestList").querySelectorAll("[data-save]").forEach(b=>b.addEventListener("click",()=>saveStatus(b.dataset.save,b)));
}
async function saveStatus(id,button){
 const select=$("#requestList [data-status='"+CSS.escape(id)+"']");
 const status=select.value;button.disabled=true;
 const {error}=await db.from("portal_requests").update({status}).eq("id",id);
 button.disabled=false;
 if(error){alert("更新できませんでした："+error.message);return;}
 const row=rows.find(x=>x.id===id);if(row)row.status=status;render();
}
function subscribe(){
 if(channel)db.removeChannel(channel);
 channel=db.channel("admin-portal-requests").on("postgres_changes",{event:"INSERT",schema:"public",table:"portal_requests"},payload=>{
  const r=payload.new;if(!r||rows.some(x=>x.id===r.id))return;
  rows.unshift(r);seen.add(r.id);render();$("#connection").textContent="リアルタイム接続中";
  if("Notification" in window&&Notification.permission==="granted")new Notification("KURO Lab｜新着リクエスト",{body:String(r.message||"新しいリクエストが届きました").slice(0,100)});
 }).on("postgres_changes",{event:"UPDATE",schema:"public",table:"portal_requests"},payload=>{
  const i=rows.findIndex(x=>x.id===payload.new.id);if(i>=0)rows[i]=payload.new;render();
 }).subscribe(s=>{$("#connection").textContent=s==="SUBSCRIBED"?"リアルタイム接続中":"再接続待機中";});
}
async function enter(user){
 try{await checkAdmin(user);showApp(user);await load();subscribe();setInterval(()=>{if(!$("#appView").hidden)load();},45000);}
 catch(e){await db.auth.signOut();showLogin(e.message||"管理者認証に失敗しました。");}
}
$("#loginForm").addEventListener("submit",async e=>{
 e.preventDefault();const b=$("#loginButton");b.disabled=true;$("#loginError").textContent="";
 try{const {data,error}=await db.auth.signInWithPassword({email:$("#email").value.trim(),password:$("#password").value});if(error)throw error;await enter(data.user);}
 catch(err){$("#loginError").textContent=err.message||"ログインできませんでした。";}
 finally{b.disabled=false;}
});
$("#logoutButton").addEventListener("click",async()=>{if(channel)await db.removeChannel(channel);await db.auth.signOut();showLogin("");});
$("#notifyButton").addEventListener("click",async()=>{if(!("Notification" in window)){alert("このブラウザは通知に対応していません。");return;}const p=await Notification.requestPermission();$("#notifyButton").textContent=p==="granted"?"通知は有効":"通知を許可";});
$("#filters").addEventListener("click",e=>{const b=e.target.closest("button[data-filter]");if(!b)return;filter=b.dataset.filter;$("#filters").querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b));render();});
$("#search").addEventListener("input",render);
db.auth.getSession().then(({data})=>{if(data.session)enter(data.session.user);});
db.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT")showLogin("");});
})();
</script>
</body></html>
