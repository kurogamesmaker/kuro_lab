name: Deploy KURO Lab Worker and static assets

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kuro-lab-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site and Worker assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # wrangler.jsonc bundles the repository root as Worker static assets.
      # Therefore HTML/CSS/JS changes must deploy too, not only worker.js changes.
      # PC game launcher and layout fixes are part of the production static asset bundle.
      - name: Deploy to Cloudflare
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
