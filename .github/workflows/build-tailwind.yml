name: Build production Tailwind CSS

on:
  push:
    branches:
      - main
    paths:
      - "sns/**/*.html"
      - "sns/tailwind.input.css"
      - "tailwind.config.js"
      - "package.json"
      - ".github/workflows/build-tailwind.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Tailwind CSS
        run: npm install --no-audit --no-fund
      - name: Build minified production CSS
        run: npm run build
      - name: Commit generated CSS for Cloudflare static assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tailwind.css
          if git diff --cached --quiet; then
            echo "Production CSS is already up to date."
          else
            git commit -m "Build production Tailwind CSS"
            git push
          fi
