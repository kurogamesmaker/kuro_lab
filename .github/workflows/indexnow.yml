name: Notify search engines with IndexNow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-notify
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Pages deployment
        run: sleep 45

      - name: Submit sitemap URLs to IndexNow
        env:
          SITE_URL: https://kurolab.cc.cd
          INDEXNOW_KEY: 9f4c7a2e6b1d8f305ac9e7421d6b0c8f
        run: |
          node --input-type=module <<'NODE'
          const site = process.env.SITE_URL;
          const key = process.env.INDEXNOW_KEY;
          const sitemapUrl = new URL('/sitemap.xml', site).href;
          let sitemap;
          for (let attempt = 1; attempt <= 8; attempt++) {
            try {
              const response = await fetch(sitemapUrl, { cache: 'no-store' });
              if (!response.ok) throw new Error(`Sitemap HTTP ${response.status}`);
              sitemap = await response.text();
              if (sitemap.includes('<urlset') && sitemap.includes('<loc>')) break;
              throw new Error('Sitemap XML is empty or invalid');
            } catch (error) {
              if (attempt === 8) throw error;
              console.log(`Sitemap not ready (attempt ${attempt}/8): ${error.message}`);
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
          }

          const urls = [...sitemap.matchAll(/<loc>\s*([^<]+?)\s*<\/loc>/g)]
            .map(match => match[1].trim())
            .filter(url => {
              try { return new URL(url).hostname === new URL(site).hostname; }
              catch { return false; }
            });

          if (!urls.length) throw new Error('No valid URLs found in sitemap');

          const response = await fetch('https://api.indexnow.org/indexnow', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json; charset=utf-8' },
            body: JSON.stringify({
              host: new URL(site).hostname,
              key,
              keyLocation: new URL(`/${key}.txt`, site).href,
              urlList: urls
            })
          });

          const body = await response.text();
          if (![200, 202].includes(response.status)) {
            throw new Error(`IndexNow rejected the request: HTTP ${response.status} ${body}`);
          }
          console.log(`IndexNow accepted ${urls.length} URLs. HTTP ${response.status}`);
          NODE
