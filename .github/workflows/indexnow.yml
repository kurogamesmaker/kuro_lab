name: Notify search engines with IndexNow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-notify
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Submit sitemap URLs to IndexNow
        env:
          SITE_URL: https://kurolab.cc.cd
          INDEXNOW_KEY: 9f4c7a2e6b1d8f305ac9e7421d6b0c8f
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const site = process.env.SITE_URL;
          const key = process.env.INDEXNOW_KEY;
          const sitemap = readFileSync('sitemap.xml', 'utf8').replace(/^\uFEFF/, '');
          const publishedKey = readFileSync(\`\${key}.txt\`, 'utf8').trim();

          if (!sitemap.includes('<urlset') || !sitemap.includes('<loc>')) {
            throw new Error('Repository sitemap.xml is empty or invalid');
          }
          if (publishedKey !== key) {
            throw new Error('IndexNow key file does not match INDEXNOW_KEY');
          }

          const urls = [...sitemap.matchAll(/<loc>\s*([^<]+?)\s*<\/loc>/g)]
            .map(match => match[1].trim())
            .filter(url => {
              try { return new URL(url).hostname === new URL(site).hostname; }
              catch { return false; }
            });

          // Notify IndexNow about account pages changed to noindex as well.
          const noindexUrls = [
            '/mypage/',
            '/favorites/',
            '/history/',
            '/achievements/',
            '/settings/'
          ].map(path => new URL(path, site).href);

          const submittedUrls = [...new Set([...urls, ...noindexUrls])];
          if (!urls.length) throw new Error('No valid URLs found in repository sitemap.xml');

          const response = await fetch('https://api.indexnow.org/indexnow', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json; charset=utf-8' },
            body: JSON.stringify({
              host: new URL(site).hostname,
              key,
              keyLocation: new URL(\`/\${key}.txt\`, site).href,
              urlList: submittedUrls
            })
          });

          const body = await response.text();
          if (![200, 202].includes(response.status)) {
            throw new Error(\`IndexNow rejected the request: HTTP \${response.status} \${body}\`);
          }
          console.log(\`IndexNow accepted \${submittedUrls.length} URLs. HTTP \${response.status}\`);
          NODE
