name: Validate KURO online scripts
on:
  push:
    branches: [main]
    paths:
      - online-room-worker.js
      - game-studio/kurog-online.js
      - game-studio/code.html
      - game-studio/code-core-v4.js
      - games/play/index.html
      - games/play/launcher.js
      - games/index.html
      - games/mypage/index.html
      - supabase/functions/kurogames-online/index.ts
      - worker.js
      - kuro-data-sync.js
      - kuro-economy-d1.js
      - kuro-profile.js
      - service-notification-box.js
      - games/notifications/index.html
      - supabase/functions/admin-console/index.ts
      - supabase/functions/kurogames-store/index.ts
      - supabase/functions/kuro-public-coin-balance/index.ts
      - supabase/migrations/**
      - tests/online-room-worker.test.mjs
      - tests/pc-game-runtime.test.mjs
      - .github/workflows/validate-online.yml
  pull_request:
    paths:
      - online-room-worker.js
      - game-studio/kurog-online.js
      - game-studio/code.html
      - game-studio/code-core-v4.js
      - games/play/index.html
      - games/play/launcher.js
      - games/index.html
      - games/mypage/index.html
      - supabase/functions/kurogames-online/index.ts
      - worker.js
      - kuro-data-sync.js
      - kuro-economy-d1.js
      - kuro-profile.js
      - service-notification-box.js
      - games/notifications/index.html
      - supabase/functions/admin-console/index.ts
      - supabase/functions/kurogames-store/index.ts
      - supabase/functions/kuro-public-coin-balance/index.ts
      - supabase/migrations/**
      - tests/online-room-worker.test.mjs
      - tests/pc-game-runtime.test.mjs
      - .github/workflows/validate-online.yml
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check online-room-worker.js
      - run: node --check worker.js
      - run: node --check kuro-data-sync.js
      - run: node --check kuro-economy-d1.js
      - run: node --check kuro-profile.js
      - run: node --check service-notification-box.js
      - run: node --test tests/online-room-worker.test.mjs
      - run: node --test tests/pc-game-runtime.test.mjs
      - run: node --check game-studio/kurog-online.js
      - run: node --check games/play/launcher.js
      - run: node --check game-studio/code-core-v4.js
      - name: Check embedded game and Studio scripts
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const file of ['games/play/index.html', 'games/index.html', 'games/mypage/index.html', 'games/notifications/index.html', 'game-studio/code.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi)];
            let checked = 0;
            for (const [, attrs, source] of scripts) {
              if (/\bsrc\s*=/.test(attrs)) continue;
              if (/\btype\s*=\s*["'](?:application\/ld\+json|application\/json|importmap)["']/i.test(attrs)) continue;
              new Function(source);
              checked++;
            }
            if (!checked) throw new Error('No inline scripts checked in ' + file);
            console.log(file + ': ' + checked + ' inline script(s) passed');
          }
          NODE
