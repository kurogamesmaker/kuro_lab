name: Deploy KURO Cloudflare data sync Worker

on:
  push:
    branches:
      - main
    paths:
      - "kuro-data-sync.js"
      - "wrangler.data-sync.jsonc"
      - ".github/workflows/deploy-kuro-data-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kuro-data-sync-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy data sync Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy sync Worker
        run: npx --yes wrangler@4 deploy --config wrangler.data-sync.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
