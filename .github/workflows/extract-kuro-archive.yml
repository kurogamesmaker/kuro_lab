name: Extract KURO Lab site archive

on:
  push:
    paths:
      - "kuro-main.zip"
      - ".github/workflows/extract-kuro-archive.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract site files
        shell: bash
        run: |
          set -euo pipefail
          test -f kuro-main.zip
          mkdir -p .kuro-archive-tmp
          unzip -q kuro-main.zip -d .kuro-archive-tmp
          test -d .kuro-archive-tmp/kuro-main
          cp -a .kuro-archive-tmp/kuro-main/. .
          rm -rf .kuro-archive-tmp

      - name: Set production domain metadata
        shell: bash
        run: |
          set -euo pipefail
          find . -path './.git' -prune -o -type f \( -name '*.html' -o -name '*.xml' -o -name '*.txt' \) -print0 |
            xargs -0 -r sed -i 's#https://kuro-phi-gold.vercel.app#https://kurolab.cc.cd#g'
          if grep -R -n --include='*.html' --include='*.xml' --include='*.txt' 'kuro-phi-gold.vercel.app' .; then
            echo "Legacy production hostname remains."
            exit 1
          fi

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted file changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Set KURO Lab custom production domain"
          git push origin HEAD:main
