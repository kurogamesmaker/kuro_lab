<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ゲーム一覧 | KURO GAMES</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#263b70,transparent 48%),#090d18;color:#fff;font-family:system-ui,sans-serif}
header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1200px)/2));border-bottom:1px solid #ffffff20}.logo{font-size:22px;font-weight:1000;text-decoration:none;color:#fff}.logo span{color:#9e82ff}header a:last-child{color:white;text-decoration:none;font-size:12px;font-weight:800;border:1px solid #ffffff35;border-radius:999px;padding:9px 14px}

.sushi{background:radial-gradient(circle at 50% 38%,#fff0b8,#f49b55 52%,#b53d4c)}.puzzle{background:radial-gradient(circle at 50% 38%,#d6f8ff,#499dd3 54%,#243b80)}.action{background:radial-gradient(circle at 50% 38%,#ffd0e8,#d64e8d 54%,#56245f)}.space{background:radial-gradient(circle at 50% 38%,#d5c9ff,#6b62d9 54%,#24265e)}.racing{background:radial-gradient(circle at 50% 38%,#ffe4a3,#e47a32 54%,#73331d)}.sim{background:radial-gradient(circle at 50% 38%,#d8ffc7,#5ba66d 54%,#194d43)}.arcade{background:radial-gradient(circle at 50% 38%,#fff0a8,#d8b43d 54%,#684b19)}.rhythm{background:radial-gradient(circle at 50% 38%,#e5d2ff,#9566db 54%,#39245d)}
@media(max-width:600px){main{margin-top:20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{border-radius:13px}}
</style></head><body><header><a class="logo" href="/games/">KURO<span>GAMES</span></a><a href="/games/">トップへ ↗</a></header><main><div class="grid">
