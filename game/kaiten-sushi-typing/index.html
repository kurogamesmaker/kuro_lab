<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090d18">
<title>回転寿司タイピング | KURO GAMES</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#253b6b 0,transparent 48%),#090d18;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid #ffffff18;background:#090d18e8}.logo{font-weight:1000;font-size:21px;letter-spacing:-.7px}.logo span{color:#9e82ff}.top a:last-child{font-size:12px;font-weight:800;padding:9px 14px;border-radius:999px;background:#ffffff12;border:1px solid #ffffff2a}
.layout{max-width:1600px;margin:0 auto;padding:24px 22px 36px;display:grid;grid-template-columns:minmax(130px,190px) minmax(0,940px) minmax(130px,190px);gap:20px;align-items:center;min-height:calc(100vh - 64px)}
.rail{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-content:center}
.thumb{display:block;aspect-ratio:1/1;border-radius:17px;overflow:hidden;border:1px solid #ffffff25;box-shadow:0 8px 20px #0006;position:relative;transition:transform .18s,border-color .18s;background:#18233d}
.thumb:hover{transform:translateY(-4px) scale(1.025);border-color:#a995ff}
.art{height:100%;width:100%;display:grid;place-items:center;font-size:clamp(34px,4vw,62px);position:relative;isolation:isolate;text-shadow:0 8px 12px #0007}
.art:before{content:"";position:absolute;inset:9%;border:2px solid #ffffff45;border-radius:30% 70% 55% 45%;transform:rotate(-20deg);z-index:-1}
.sushi{background:radial-gradient(circle at 48% 35%,#fff0b8,#f49b55 52%,#b53d4c)}
.puzzle{background:radial-gradient(circle at 48% 35%,#d6f8ff,#499dd3 54%,#243b80)}
.action{background:radial-gradient(circle at 48% 35%,#ffd0e8,#d64e8d 54%,#56245f)}
.space{background:radial-gradient(circle at 48% 35%,#d5c9ff,#6b62d9 54%,#24265e)}
.racing{background:radial-gradient(circle at 48% 35%,#ffe4a3,#e47a32 54%,#73331d)}
.sim{background:radial-gradient(circle at 48% 35%,#d8ffc7,#5ba66d 54%,#194d43)}
.arcade{background:radial-gradient(circle at 48% 35%,#fff0a8,#d8b43d 54%,#684b19)}
.rhythm{background:radial-gradient(circle at 48% 35%,#e5d2ff,#9566db 54%,#39245d)}
.center{min-width:0;width:100%;border-radius:20px;overflow:hidden;background:#f7f1e5;box-shadow:0 20px 65px #0009;border:1px solid #ffffff36}
.frame-head{height:42px;background:#171d2d;display:flex;align-items:center;justify-content:space-between;padding:0 15px;color:#dce3f5;font-size:11px;font-weight:800;letter-spacing:.4px}
.dots{display:flex;gap:5px}.dots i{width:8px;height:8px;border-radius:50%;background:#69748b}
iframe{display:block;width:100%;height:min(78vh,790px);min-height:590px;border:0;background:#f7f1e5}
@media(max-width:1050px){.layout{grid-template-columns:1fr;gap:14px;padding:16px}.center{grid-row:1}.rail{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.rail.left{grid-row:2}.rail.right{grid-row:3}.art{font-size:clamp(28px,7vw,52px)}iframe{height:78vh;min-height:560px}}
@media(max-width:560px){.top{height:56px;padding:0 14px}.layout{padding:10px;gap:10px}.rail{gap:7px}.thumb{border-radius:11px}.center{border-radius:13px}.frame-head{height:34px}iframe{height:78vh;min-height:520px}}
</style>
</head>
<body>
<header class="top"><a class="logo" href="/games/">KURO<span>GAMES</span></a><a href="/game/">ゲーム一覧へ　↗</a></header>
<div class="layout">
<aside class="rail left" aria-label="ゲーム一覧">
<a class="thumb" href="/game/kaiten-sushi-typing/" title="回転寿司タイピング"><div class="art sushi">🍣</div></a>
<div class="thumb" aria-label="パズルゲーム"><div class="art puzzle">🧩</div></div>
<div class="thumb" aria-label="アクションゲーム"><div class="art action">⚔️</div></div>
<div class="thumb" aria-label="宇宙ゲーム"><div class="art space">🚀</div></div>
</aside>
<section class="center" aria-label="ゲームプレイ画面">
<div class="frame-head"><span>NOW PLAYING</span><span class="dots"><i></i><i></i><i></i></span></div>
<iframe src="play.html" title="回転寿司タイピング" allow="fullscreen" loading="eager"></iframe>
</section>
<aside class="rail right" aria-label="ゲーム一覧">
<div class="thumb" aria-label="レースゲーム"><div class="art racing">🏎️</div></div>
<div class="thumb" aria-label="シミュレーションゲーム"><div class="art sim">🌳</div></div>
<div class="thumb" aria-label="アーケードゲーム"><div class="art arcade">🏆</div></div>
<div class="thumb" aria-label="リズムゲーム"><div class="art rhythm">🎵</div></div>
</aside>
</div>
</body></html>
